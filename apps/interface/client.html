<!DOCTYPE html>
<html lang="es" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroManual · Portal de cliente</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='none' stroke='%230e1116' stroke-width='2'/><circle cx='16' cy='16' r='8' fill='%234f46e5'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f6f7f9; --bg-2: #eff1f4; --bg-3: #e9edf3; --line: #e6e9ee;
      --fg: #0e1116; --fg-2: #3a4150; --fg-3: #6b7280;
      --accent: #4f46e5; --accent-h: #4338ca; --accent-soft: #eef0fe;
      --ok: #047857; --warn: #b7791f; --err: #e5484d;
      --r: 14px; --r-sm: 10px;
      --shadow: 0 1px 2px rgba(14,17,22,0.04), 0 8px 24px rgba(14,17,22,0.06);
      --font: 'IBM Plex Sans', system-ui, sans-serif;
      --display: 'Space Grotesk', system-ui, sans-serif;
    }
    .login-brand-name, .topbar-brand-name, .login-title, .card-title, .auto-name, .google-box-title { font-family: var(--display); }
    .login-title { font-size: 22px; letter-spacing: -.01em; }
    .auto-card { border-radius: var(--r-sm); }
    .btn { font-weight: 600; }
    html, body { height: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.5; }
    #login-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; transition: opacity .2s;
    }
    #login-overlay.hidden { opacity: 0; pointer-events: none; }
    .login-card {
      background: #fff; border: 1px solid var(--line); border-radius: var(--r);
      box-shadow: var(--shadow); padding: 40px 36px; width: 340px;
    }
    .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .login-brand-mark {
      width: 28px; height: 28px; border: 1.5px solid var(--fg); border-radius: 50%;
      position: relative; display: inline-block; flex-shrink: 0;
    }
    .login-brand-mark::after {
      content: ""; position: absolute; inset: 5px;
      background: var(--accent); border-radius: 50%; animation: pulse 2.4s ease-in-out infinite;
    }
    .login-brand-name { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
    .login-brand-name span { font-weight: 300; }
    .login-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .login-sub { color: var(--fg-3); margin-bottom: 24px; font-size: 13px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--fg-2); margin-bottom: 5px; }
    .form-group input {
      width: 100%; padding: 9px 11px; background: var(--bg); border: 1px solid var(--line);
      border-radius: var(--r-sm); font: inherit; font-size: 14px; color: var(--fg);
      outline: none; transition: border-color .15s;
    }
    .form-group input:focus { border-color: var(--accent); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px;
      border-radius: var(--r-sm); border: 1px solid transparent; font: inherit;
      font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none;
      transition: background .15s, border-color .15s, color .15s; white-space: nowrap;
    }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-h); }
    .btn.ghost { background: transparent; border-color: var(--line); color: var(--fg-2); }
    .btn.ghost:hover { background: var(--bg-2); }
    .btn.danger { background: transparent; border-color: var(--err); color: var(--err); }
    .btn.danger:hover { background: var(--err); color: #fff; }
    .btn.sm { padding: 5px 10px; font-size: 12px; }
    .btn.full { width: 100%; justify-content: center; margin-top: 8px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .error-msg { color: var(--err); font-size: 12px; margin-top: 8px; min-height: 16px; }
    #app { display: flex; flex-direction: column; height: 100%; }
    .topbar {
      background: #fff; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; padding: 0 20px; height: 52px; gap: 16px; flex-shrink: 0;
    }
    .topbar-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--fg); }
    .topbar-brand-mark {
      width: 22px; height: 22px; border: 1.5px solid var(--fg); border-radius: 50%;
      position: relative; display: inline-block; flex-shrink: 0;
    }
    .topbar-brand-mark::after {
      content: ""; position: absolute; inset: 4px;
      background: var(--accent); border-radius: 50%; animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.55); opacity: 0.7; } }
    .topbar-brand-name { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
    .topbar-brand-name span { font-weight: 300; }
    .topbar-divider { width: 1px; height: 18px; background: var(--line); }
    .topbar-sub { font-size: 12px; color: var(--fg-3); }
    .topbar-spacer { flex: 1; }
    .topbar-user { font-size: 12px; color: var(--fg-3); }
    .topbar-user strong { color: var(--fg-2); }
    .workspace { flex: 1; display: flex; min-height: 0; }
    .sidebar {
      width: 260px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar-section { padding: 14px 12px 8px; }
    .sidebar-label {
      font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
      color: var(--fg-3); padding: 0 8px 8px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      padding: 9px 10px; border: none; background: transparent; border-radius: var(--r-sm);
      cursor: pointer; font: inherit; font-size: 13px; color: var(--fg-2);
      transition: background .12s, color .12s;
    }
    .nav-item:hover { background: var(--bg-2); color: var(--fg); }
    .nav-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .nav-item .nav-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); flex-shrink: 0; }
    .nav-item.on .nav-dot, .nav-item.active-auto .nav-dot { background: var(--ok); }
    .nav-item .nav-meta { margin-left: auto; font-size: 11px; color: var(--fg-3); font-weight: 500; }
    .nav-item .nav-badge {
      margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--accent); color: #fff; font-size: 10px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .sidebar-foot { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); }
    .panel { flex: 1; overflow-y: auto; padding: 24px 20px; background: var(--bg); }
    .panel-subtabs { display: flex; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    .panel-subtab {
      padding: 8px 12px; font-size: 13px; font-weight: 500; color: var(--fg-3);
      border: none; background: transparent; cursor: pointer; border-bottom: 2px solid transparent;
      font-family: inherit;
    }
    .panel-subtab:hover { color: var(--fg); }
    .panel-subtab.on { color: var(--fg); border-bottom-color: var(--accent); }
    .mode-toggle {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .mode-option {
      flex: 1; min-width: 180px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-sm);
      background: var(--bg); cursor: pointer; text-align: left; font: inherit;
      transition: border-color .15s, background .15s;
    }
    .mode-option:hover { border-color: var(--accent); }
    .mode-option.on { border-color: var(--accent); background: var(--accent-soft); }
    .mode-option strong { display: block; font-size: 13px; margin-bottom: 4px; color: var(--fg); }
    .mode-option span { font-size: 12px; color: var(--fg-3); line-height: 1.4; }
    .draft-text {
      width: 100%; min-height: 70px; padding: 8px; border: 1px solid var(--line);
      border-radius: var(--r-sm); font: inherit; font-size: 13px; color: var(--fg);
      background: #fff; resize: vertical;
    }
    .hist-row {
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .hist-row:last-child { border-bottom: none; }
    .hist-meta { font-size: 12px; color: var(--fg-3); margin-bottom: 4px; }
    .hist-body { font-size: 13px; color: var(--fg-2); white-space: pre-wrap; }
    @media (max-width: 720px) {
      .workspace { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--line); max-height: 40vh; }
    }
    .card { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 20px; margin-bottom: 16px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .card-title { font-size: 13px; font-weight: 600; }
    .card-sub { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
    .auto-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .auto-card {
      background: var(--bg); border: 1px solid var(--line); border-radius: var(--r);
      padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s;
    }
    .auto-card:hover { border-color: var(--accent); }
    .auto-card-body { flex: 1; }
    .auto-name { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
    .auto-desc { font-size: 12px; color: var(--fg-3); line-height: 1.4; }
    .auto-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .auto-status { font-size: 11px; font-weight: 500; }
    .auto-status.on { color: var(--ok); }
    .auto-status.off { color: var(--fg-3); }
    .auto-warn {
      font-size: 11px; color: #8a6516; background: #faf0da;
      border-radius: var(--r-sm); padding: 6px 10px;
    }
    .auto-warn a { color: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; }
    .google-box {
      border: 1px solid var(--line); border-radius: var(--r); padding: 24px;
      background: var(--bg); display: flex; flex-direction: column; gap: 16px; max-width: 480px;
    }
    .google-box-head { display: flex; align-items: center; gap: 10px; }
    .google-box-icon { width: 32px; height: 32px; flex-shrink: 0; }
    .acct-icon {
      width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .google-box-title { font-size: 15px; font-weight: 600; }
    .google-box-sub { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
    .google-box-body { font-size: 13px; color: var(--fg-2); line-height: 1.6; }
    .google-box-meta { font-size: 12px; color: var(--fg-3); }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 500; line-height: 1.5; }
    .badge.ok { background: #e3f3eb; color: #1f6e49; }
    .badge.neu { background: var(--bg-2); color: var(--fg-3); }
    .empty { text-align: center; padding: 48px 16px; color: var(--fg-3); font-size: 13px; }
    .loading { text-align: center; padding: 32px; color: var(--fg-3); font-size: 13px; }
    #toast {
      position: fixed; bottom: 24px; right: 24px; background: var(--fg); color: var(--bg);
      border-radius: var(--r-sm); padding: 10px 16px; font-size: 13px; font-weight: 500;
      transform: translateY(16px); opacity: 0; transition: transform .2s, opacity .2s;
      pointer-events: none; z-index: 200;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.ok { background: var(--ok); }
    #toast.err { background: var(--err); }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  </style>
</head>
<body>

<!-- Login -->
<div id="login-overlay">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-mark"></div>
      <div class="login-brand-name">Zero<span>Manual</span></div>
    </div>
    <!-- Login view -->
    <div id="view-login">
      <div class="login-title">Portal de cliente</div>
      <div class="login-sub">Accede a tu panel de automatizaciones.</div>
      <div class="form-group">
        <label for="inp-email">Email</label>
        <input id="inp-email" type="email" autocomplete="email" placeholder="tu@empresa.com" />
      </div>
      <div class="form-group">
        <label for="inp-password">Contraseña</label>
        <input id="inp-password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <div class="error-msg" id="login-error"></div>
      <button class="btn primary full" id="btn-login">Entrar →</button>
      <div style="text-align:center;margin-top:14px;font-size:12px;color:var(--fg-3)">
        ¿Primera vez? <button onclick="showRegister()" style="background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:12px;padding:0">Crear cuenta</button>
      </div>
    </div>
    <!-- Register view -->
    <div id="view-register" style="display:none">
      <div class="login-title">Crear cuenta</div>
      <div class="login-sub">Empieza a automatizar tu negocio.</div>
      <div class="form-group">
        <label for="reg-name">Nombre del negocio</label>
        <input id="reg-name" type="text" placeholder="Café Luma" />
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" autocomplete="email" placeholder="tu@empresa.com" />
      </div>
      <div class="form-group">
        <label for="reg-password">Contraseña</label>
        <input id="reg-password" type="password" placeholder="Mínimo 8 caracteres" />
      </div>
      <div class="error-msg" id="register-error"></div>
      <button class="btn primary full" id="btn-register">Crear cuenta →</button>
      <div style="text-align:center;margin-top:14px;font-size:12px;color:var(--fg-3)">
        ¿Ya tienes cuenta? <button onclick="showLogin()" style="background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:12px;padding:0">Entrar</button>
      </div>
    </div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="topbar">
    <a class="topbar-brand" href="/">
      <div class="topbar-brand-mark"></div>
      <div class="topbar-brand-name">Zero<span>Manual</span></div>
    </a>
    <div class="topbar-divider"></div>
    <div class="topbar-sub">Portal de cliente</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-user" id="lbl-business"></div>
    <button class="btn ghost sm" id="btn-home">Volver a inicio</button>
    <button class="btn ghost sm" id="btn-logout">Cerrar sesión</button>
  </div>
  <div class="workspace">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="panel" id="content"></main>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  const TOKEN_KEY = 'mz_client_token';
  const CART_HANDOFF_KEY = 'zm_pending_activations';
  let token = localStorage.getItem(TOKEN_KEY) || null;
  let currentClient = null;
  // view: 'catalog' | 'google' | automation_type
  let activeView = 'catalog';
  let activeBusinessId = null; // business context for the open automation panel
  let reviewsSubtab = 'reviews'; // reviews | pending | history | settings
  let cachedAutos = null;
  let cachedBusinesses = [];

  const AUTOMATION_LABELS = {
    google_reviews: { name: 'Responder reseñas de Google',   desc: 'Responde automáticamente cada nueva reseña con tu voz y tono.' },
    gmb_posts:      { name: 'Publicar en Google Business',   desc: 'Publica actualizaciones regulares en tu ficha de Google Business.' },
    instagram_posts:{ name: 'Publicar en Instagram',         desc: 'Programa y publica contenido en Instagram de forma automática.' },
    newsletter:     { name: 'Newsletter a clientes',         desc: 'Envía un email semanal a tu lista de clientes.' },
    dms:            { name: 'Responder DMs y comentarios',   desc: 'Contesta mensajes directos y comentarios automáticamente.' },
  };

  const $ = id => document.getElementById(id);
  let toastTimer = null;

  function toast(msg, kind = '') {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'show' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 2800);
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
  }

  async function api(method, path, body) {
    const opts = { method, headers: authHeaders() };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch(path, opts);
    if (r.status === 401) { doLogout(); return null; }
    if (!r.ok) {
      const t = await r.text();
      let detail = t;
      try { detail = JSON.parse(t).detail || t; } catch {}
      throw new Error(detail);
    }
    return r.json();
  }

  function dateStr(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
  }

  function statusLabel(st) {
    const map = {
      pending: 'Pendiente', approved: 'Aprobada', edited: 'Editada',
      rejected: 'Rechazada', auto_sent: 'Auto-enviada', failed: 'Fallida',
    };
    return map[st] || st;
  }

  async function tryLogin() {
    const email = $('inp-email').value.trim(), password = $('inp-password').value;
    $('login-error').textContent = '';
    if (!email || !password) { $('login-error').textContent = 'Completa el email y la contraseña.'; return; }
    const btn = $('btn-login');
    btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      const r = await fetch('/client/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || 'Error de autenticación');
      token = data.token;
      currentClient = data.client || data.user;
      localStorage.setItem(TOKEN_KEY, token);
      showApp();
    } catch (e) {
      $('login-error').textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = 'Entrar →';
    }
  }

  async function doLogout() {
    if (token) {
      try { await fetch('/client/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }); } catch {}
    }
    token = null; currentClient = null;
    localStorage.removeItem(TOKEN_KEY);
    window.location.href = '/';
  }

  async function tryRestoreSession() {
    if (!token) return false;
    try {
      const r = await fetch('/client/me', { headers: { 'Authorization': `Bearer ${token}` } });
      if (!r.ok) { token = null; localStorage.removeItem(TOKEN_KEY); return false; }
      const data = await r.json();
      currentClient = data.client || data.user;
      return true;
    } catch { return false; }
  }

  async function applyPendingActivations() {
    let pending;
    try { pending = JSON.parse(localStorage.getItem(CART_HANDOFF_KEY) || '[]'); } catch { pending = []; }
    if (!Array.isArray(pending) || !pending.length) return;
    let activated = 0;
    const failed = [];
    let lastError = '';
    for (const type of pending) {
      try { await api('POST', `/client/automations/${encodeURIComponent(type)}/activate`); activated++; }
      catch (e) { failed.push(type); lastError = e.message || 'Error desconocido'; }
    }
    if (failed.length) localStorage.setItem(CART_HANDOFF_KEY, JSON.stringify(failed));
    else localStorage.removeItem(CART_HANDOFF_KEY);
    if (activated) toast(`${activated} automatización(es) activada(s)`, 'ok');
    if (failed.length) toast(`No se pudo activar: ${lastError}`, 'err');
  }

  async function showApp() {
    $('login-overlay').classList.add('hidden');
    const name = currentClient ? (currentClient.business_name || currentClient.name || currentClient.email || '—') : '—';
    $('lbl-business').innerHTML = `<strong>${escHtml(name)}</strong>`;
    await applyPendingActivations();
    await loadWorkspace();
  }

  async function fetchAutomations() {
    const data = await api('GET', '/client/automations');
    if (!data) return null;
    cachedAutos = data;
    return data;
  }

  async function fetchBusinesses() {
    try {
      const data = await api('GET', '/client/businesses');
      cachedBusinesses = (data && data.businesses) || [];
    } catch {
      cachedBusinesses = [];
    }
    return cachedBusinesses;
  }

  function bizQuery(businessId) {
    return businessId ? `business_id=${encodeURIComponent(businessId)}` : '';
  }

  function withQuery(path, query) {
    if (!query) return path;
    return path + (path.includes('?') ? '&' : '?') + query;
  }

  async function loadWorkspace() {
    const side = $('sidebar');
    const c = $('content');
    c.innerHTML = '<div class="loading">Cargando…</div>';
    try {
      const [data] = await Promise.all([fetchAutomations(), fetchBusinesses()]);
      if (!data) return;
      const active = (data.active || []).filter(a => a.status === 'active');
      const activeTypes = [...new Set(active.map(a => a.automation_type))];
      if (activeView !== 'catalog' && activeView !== 'google' && activeView !== 'accounts') {
        if (!activeTypes.includes(activeView)) {
          activeView = activeTypes.length ? activeTypes[0] : 'catalog';
        }
      }
      renderSidebar(side, active);
      await renderPanel(c, data);
    } catch (e) {
      c.innerHTML = `<div class="card"><div class="empty">Error cargando datos. Recarga la página.</div></div>`;
    }
  }

  function renderSidebar(side, active) {
    const byType = new Map();
    active.forEach(a => {
      if (!byType.has(a.automation_type)) byType.set(a.automation_type, []);
      byType.get(a.automation_type).push(a);
    });
    const items = [...byType.entries()].map(([type, rows]) => {
      const lbl = AUTOMATION_LABELS[type] || { name: type };
      const on = activeView === type ? ' on active-auto' : ' active-auto';
      const badge = rows.length > 1 ? `<span class="nav-meta">${rows.length} negocios</span>` : '';
      return `<button class="nav-item${on}" data-view="${escHtml(type)}">
        <span class="nav-dot"></span>
        <span>${escHtml(lbl.name)}</span>
        ${badge}
      </button>`;
    }).join('') || `<div style="padding:8px 10px;font-size:12px;color:var(--fg-3)">Ninguna suscrita aún</div>`;

    side.innerHTML = `
      <div class="sidebar-section">
        <div class="sidebar-label">Mis automatizaciones</div>
        ${items}
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Cuenta</div>
        <button class="nav-item${activeView === 'catalog' ? ' on' : ''}" data-view="catalog">Catálogo / suscribir</button>
        <button class="nav-item${activeView === 'google' || activeView === 'accounts' ? ' on' : ''}" data-view="accounts">Conectar cuentas</button>
      </div>
      <div class="sidebar-foot">
        <div style="font-size:11px;color:var(--fg-3);line-height:1.4">Selecciona una automatización para ver su panel.</div>
      </div>`;
    side.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        activeView = btn.dataset.view;
        activeBusinessId = null;
        if (activeView === 'google_reviews') reviewsSubtab = 'reviews';
        loadWorkspace();
      });
    });
  }

  async function renderPanel(c, data) {
    if (activeView === 'catalog') {
      renderCatalog(c, data);
      return;
    }
    if (activeView === 'accounts' || activeView === 'google') {
      await renderAccounts(c);
      return;
    }
    if (activeView === 'google_reviews') {
      await renderGoogleReviews(c);
      return;
    }
    const lbl = AUTOMATION_LABELS[activeView] || { name: activeView, desc: '' };
    c.innerHTML = `<div class="card">
      <div class="card-head"><div>
        <div class="card-title">${escHtml(lbl.name)}</div>
        <div class="card-sub">${escHtml(lbl.desc)}</div>
      </div></div>
      <div class="empty">Panel de esta automatización próximamente.</div>
    </div>`;
  }

  function renderCatalog(c, data) {
    const available = data.available || [];
    const active = data.active || [];
    if (!available.length) {
      c.innerHTML = '<div class="card"><div class="empty">Las automatizaciones estarán disponibles próximamente.</div></div>';
      return;
    }
    const multiBiz = cachedBusinesses.length > 1;
    c.innerHTML = `<div class="card">
      <div class="card-head"><div>
        <div class="card-title">Catálogo de automatizaciones</div>
        <div class="card-sub">${available.length} disponible(s)${multiBiz ? ` · ${cachedBusinesses.length} negocios detectados — 20% dto. a partir del 2º` : ''}</div>
      </div></div>
      <div class="auto-grid" id="auto-grid"></div>
    </div>`;
    const grid = $('auto-grid');
    available.forEach(type => {
      const rows = active.filter(a => a.automation_type === type && a.status === 'active');
      const isOn = rows.length > 0;
      const lbl = AUTOMATION_LABELS[type] || { name: type, desc: '' };
      const div = document.createElement('div');
      div.className = 'auto-card';
      div.dataset.type = type;
      div.innerHTML = `
        <div class="auto-card-body">
          <div class="auto-name">${escHtml(lbl.name)}</div>
          <div class="auto-desc">${escHtml(lbl.desc)}</div>
        </div>
        <div class="auto-footer">
          <span class="auto-status ${isOn ? 'on' : 'off'}">${isOn ? `● Suscrito${rows.length > 1 ? ` (${rows.length} negocios)` : ''}` : '○ Sin suscripción'}</span>
          <div style="display:flex;gap:8px">
            ${isOn ? `<button class="btn sm ghost" data-open="${escHtml(type)}">Abrir</button>` : ''}
            <button class="btn sm ${isOn ? 'ghost' : 'primary'}" data-type="${escHtml(type)}" data-on="${isOn}">
              ${isOn ? 'Desuscribirse' : 'Suscribirse'}
            </button>
          </div>
        </div>`;
      div.querySelector('[data-type]').addEventListener('click', handleAutoBtn);
      const openBtn = div.querySelector('[data-open]');
      if (openBtn) openBtn.addEventListener('click', () => {
        activeView = type;
        activeBusinessId = null;
        reviewsSubtab = 'reviews';
        loadWorkspace();
      });
      grid.appendChild(div);
    });
  }


  async function handleAutoBtn(e) {
    const btn = e.currentTarget;
    const type = btn.dataset.type;
    const isOn = btn.dataset.on === 'true';
    btn.disabled = true;
    try {
      if (isOn) {
        const rows = (cachedAutos && cachedAutos.active || []).filter(
          a => a.automation_type === type && a.status === 'active'
        );
        const businessIds = rows.length ? rows.map(r => r.business_id) : [null];
        for (const bid of businessIds) {
          await api('DELETE', withQuery(`/client/automations/${encodeURIComponent(type)}`, bizQuery(bid)));
        }
        toast('Suscripción cancelada', 'ok');
        if (activeView === type) activeView = 'catalog';
      } else if (cachedBusinesses.length > 1) {
        await openBusinessPicker(type, btn);
        return; // picker owns the loading state / continuation
      } else {
        const checkout = await api('POST', '/client/checkout/session', {
          automation_types: [type],
          billing_interval: 'monthly',
        });
        if (checkout.checkout_url) {
          window.location.href = checkout.checkout_url;
          return;
        }
        if (checkout.mode === 'free') {
          toast('Stripe no configurado — suscripción en modo demo', 'warn');
        }
        await api('POST', `/client/automations/${encodeURIComponent(type)}/activate`);
        toast('Suscripción activada', 'ok');
        activeView = type;
      }
      await loadWorkspace();
    } catch (err) {
      if (err.message && err.message.toLowerCase().includes('google')) {
        const card = btn.closest('.auto-card');
        const warn = document.createElement('div');
        warn.className = 'auto-warn';
        warn.innerHTML = `Conecta primero tu cuenta de Google. <a class="goto-google">Ir a Conectar cuentas →</a>`;
        warn.querySelector('.goto-google').addEventListener('click', () => {
          activeView = 'accounts';
          loadWorkspace();
        });
        card.appendChild(warn);
      } else {
        toast(err.message, 'err');
      }
      btn.disabled = false;
    }
  }

  async function openBusinessPicker(type, btn) {
    const card = btn.closest('.auto-card');
    const activeForType = (cachedAutos && cachedAutos.active || []).filter(
      a => a.automation_type === type && a.status === 'active'
    );
    const activeBizIds = new Set(activeForType.map(a => a.business_id));
    const picker = document.createElement('div');
    picker.className = 'auto-warn';
    picker.style.background = 'var(--bg-2)';
    picker.style.color = 'var(--fg-2)';
    const rows = cachedBusinesses.map(b => `
      <label style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px">
        <input type="checkbox" value="${escHtml(b.business_id)}" ${activeBizIds.has(b.business_id) ? 'checked disabled' : ''} />
        ${escHtml(b.business_name)}${activeBizIds.has(b.business_id) ? ' (ya activo)' : ''}
      </label>`).join('');
    picker.innerHTML = `
      <div style="margin-bottom:6px;font-weight:600">¿Para qué negocios?</div>
      ${rows}
      <div style="margin-top:8px;font-size:11px;color:var(--fg-3)">2º negocio en adelante: 20% de descuento.</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn sm ghost" data-cancel>Cancelar</button>
        <button class="btn sm primary" data-confirm>Suscribir seleccionados</button>
      </div>`;
    card.appendChild(picker);
    btn.disabled = true;
    picker.querySelector('[data-cancel]').addEventListener('click', () => {
      picker.remove();
      btn.disabled = false;
    });
    picker.querySelector('[data-confirm]').addEventListener('click', async () => {
      const selected = [...picker.querySelectorAll('input[type=checkbox]:checked:not(:disabled)')]
        .map(i => i.value);
      if (!selected.length) { toast('Selecciona al menos un negocio', 'err'); return; }
      try {
        const business_pairs = selected.map(bid => [type, bid]);
        const checkout = await api('POST', '/client/checkout/session', {
          automation_types: [type],
          billing_interval: 'monthly',
          business_pairs,
        });
        if (checkout.checkout_url) {
          window.location.href = checkout.checkout_url;
          return;
        }
        if (checkout.mode === 'free') {
          toast('Stripe no configurado — suscripción en modo demo', 'warn');
        }
        for (const bid of selected) {
          await api('POST', withQuery(`/client/automations/${encodeURIComponent(type)}/activate`, bizQuery(bid)));
        }
        toast('Suscripción activada', 'ok');
        activeView = type;
        await loadWorkspace();
      } catch (err) {
        toast(err.message, 'err');
        picker.remove();
        btn.disabled = false;
      }
    });
  }

  async function renderGoogleReviews(c) {
    const rows = (cachedAutos && cachedAutos.active || []).filter(
      a => a.automation_type === 'google_reviews' && a.status === 'active'
    );
    if (!activeBusinessId || !rows.some(r => r.business_id === activeBusinessId)) {
      activeBusinessId = rows.length ? rows[0].business_id : null;
    }
    const bizSelector = rows.length > 1 ? `
      <select id="biz-selector" style="margin-left:auto;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;font-size:12px">
        ${rows.map(r => `<option value="${escHtml(r.business_id)}" ${r.business_id === activeBusinessId ? 'selected' : ''}>${escHtml(r.business_name || r.business_id)}</option>`).join('')}
      </select>` : '';
    c.innerHTML = `
      <div class="card" style="margin-bottom:12px">
        <div class="card-head" style="margin-bottom:0"><div>
          <div class="card-title">Responder reseñas de Google</div>
          <div class="card-sub">Revisa borradores, historial y modo de envío</div>
        </div>${bizSelector}</div>
      </div>
      <div class="panel-subtabs">
        <button class="panel-subtab${reviewsSubtab === 'reviews' ? ' on' : ''}" data-sub="reviews">Reseñas</button>
        <button class="panel-subtab${reviewsSubtab === 'pending' ? ' on' : ''}" data-sub="pending">Pendientes</button>
        <button class="panel-subtab${reviewsSubtab === 'history' ? ' on' : ''}" data-sub="history">Historial</button>
        <button class="panel-subtab${reviewsSubtab === 'settings' ? ' on' : ''}" data-sub="settings">Ajustes</button>
      </div>
      <div id="reviews-body"><div class="loading">Cargando…</div></div>`;
    c.querySelectorAll('[data-sub]').forEach(btn => {
      btn.addEventListener('click', () => {
        reviewsSubtab = btn.dataset.sub;
        renderGoogleReviews(c);
      });
    });
    const selector = $('biz-selector');
    if (selector) selector.addEventListener('change', () => {
      activeBusinessId = selector.value;
      renderGoogleReviews(c);
    });
    const body = $('reviews-body');
    if (reviewsSubtab === 'settings') await renderReviewsSettings(body);
    else if (reviewsSubtab === 'history') await renderReviewsHistory(body);
    else if (reviewsSubtab === 'pending') await renderReviewsPending(body);
    else await renderGoogleReviewsList(body);
  }

  function starsHtml(rating) {
    const n = Number(rating) || 0;
    if (!n) return '';
    return '★'.repeat(Math.min(5, Math.max(0, Math.round(n)))) + '☆'.repeat(Math.max(0, 5 - Math.round(n)));
  }

  async function renderGoogleReviewsList(body) {
    try {
      const data = await api('GET', withQuery('/client/automations/google_reviews/reviews', bizQuery(activeBusinessId)));
      if (!data) return;
      const reviews = data.reviews || [];
      const avg = data.average_rating != null ? Number(data.average_rating).toFixed(1) : '—';
      const total = data.total_review_count != null ? data.total_review_count : reviews.length;
      if (!reviews.length) {
        body.innerHTML = `<div class="card"><div class="empty">
          No hay reseñas en esta ubicación de Google Business.<br/>
          <span style="font-size:12px">Media: ${escHtml(String(avg))} · Total: ${escHtml(String(total))}</span>
        </div></div>`;
        return;
      }
      body.innerHTML = `<div class="card">
        <div class="card-head"><div>
          <div class="card-title">Reseñas de Google</div>
          <div class="card-sub">Media ${escHtml(String(avg))} · ${escHtml(String(total))} reseña(s)</div>
        </div>
        <button class="btn sm ghost" id="btn-refresh-reviews">Actualizar</button>
        </div>
        <div id="gmb-reviews-list"></div>
      </div>`;
      $('btn-refresh-reviews').addEventListener('click', () => renderGoogleReviewsList(body));
      const list = $('gmb-reviews-list');
      reviews.forEach(r => {
        const draft = r.draft;
        let draftBadge = '';
        if (draft) {
          const st = draft.status || '';
          draftBadge = `<span class="badge ${st === 'pending' ? 'neu' : 'ok'}">${escHtml(statusLabel(st))}</span>`;
        } else if (r.has_reply) {
          draftBadge = '<span class="badge ok">Respondida en Google</span>';
        } else {
          draftBadge = '<span class="badge neu">Sin respuesta</span>';
        }
        const div = document.createElement('div');
        div.className = 'auto-card';
        div.style.marginBottom = '12px';
        div.innerHTML = `
          <div class="auto-card-body">
            <div class="auto-name" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span>${escHtml(r.reviewer_name || 'Anónimo')}</span>
              <span style="color:var(--warn);font-size:12px">${starsHtml(r.rating)}</span>
              ${draftBadge}
            </div>
            <div class="hist-meta">${dateStr(r.update_time || r.create_time)}</div>
            <div class="auto-desc" style="margin:8px 0;white-space:pre-wrap">${escHtml(r.comment || '(Sin texto)')}</div>
            ${r.reply_comment ? `<div class="hist-body" style="background:var(--bg-2);padding:10px;border-radius:var(--r-sm)"><strong>Tu respuesta:</strong><br/>${escHtml(r.reply_comment)}</div>` : ''}
            ${draft && draft.status === 'pending' && draft.suggested_reply ? `<div class="card-sub" style="margin-top:8px">Borrador pendiente: ${escHtml(draft.suggested_reply.slice(0, 120))}${draft.suggested_reply.length > 120 ? '…' : ''}</div>` : ''}
          </div>
          <div class="auto-footer">
            <span class="auto-status ${r.has_reply ? 'on' : 'off'}">${r.has_reply ? '● Con respuesta' : '○ Sin respuesta en Google'}</span>
            ${draft && draft.status === 'pending' ? '<button class="btn sm ghost" data-goto-pending>Ver pendiente</button>' : ''}
          </div>`;
        const goto = div.querySelector('[data-goto-pending]');
        if (goto) goto.addEventListener('click', () => {
          reviewsSubtab = 'pending';
          loadWorkspace();
        });
        list.appendChild(div);
      });
    } catch (e) {
      const msg = e.message || 'Error cargando reseñas';
      const needsGoogle = /conecta|google|ubicación|cuenta/i.test(msg);
      body.innerHTML = `<div class="card"><div class="empty">
        ${escHtml(msg)}
        ${needsGoogle ? '<br/><br/><button class="btn sm primary" id="btn-goto-google">Ir a Conectar cuentas</button>' : ''}
      </div></div>`;
      const btn = $('btn-goto-google');
      if (btn) btn.addEventListener('click', () => { activeView = 'accounts'; loadWorkspace(); });
    }
  }

  async function renderReviewsSettings(body) {
    try {
      const data = await api('GET', withQuery('/client/automations/google_reviews/settings', bizQuery(activeBusinessId)));
      if (!data) return;
      const mode = data.reply_mode || 'approval';
      body.innerHTML = `<div class="card">
        <div class="card-title" style="margin-bottom:8px">Modo de respuesta</div>
        <div class="card-sub" style="margin-bottom:14px">Elige si las respuestas se envían solas o tras tu aprobación.</div>
        <div class="mode-toggle">
          <button class="mode-option${mode === 'approval' ? ' on' : ''}" data-mode="approval">
            <strong>Pedir permiso</strong>
            <span>ZeroManual genera el borrador y tú apruebas (o editas) antes de publicarlo en Google.</span>
          </button>
          <button class="mode-option${mode === 'auto' ? ' on' : ''}" data-mode="auto">
            <strong>Respuesta automática</strong>
            <span>Cada borrador se publica en Google sin esperar tu confirmación. Queda en el historial.</span>
          </button>
        </div>
      </div>`;
      body.querySelectorAll('[data-mode]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const next = btn.dataset.mode;
          if (next === mode) return;
          try {
            await api('PUT', withQuery('/client/automations/google_reviews/settings', bizQuery(activeBusinessId)), { reply_mode: next });
            toast(next === 'auto' ? 'Modo automático activado' : 'Modo con permiso activado', 'ok');
            renderReviewsSettings(body);
          } catch (e) { toast(e.message, 'err'); }
        });
      });
    } catch (e) {
      body.innerHTML = `<div class="card"><div class="empty">${escHtml(e.message)}</div></div>`;
    }
  }

  async function renderReviewsPending(body) {
    try {
      const data = await api('GET', withQuery('/client/automations/google_reviews/drafts?status=pending', bizQuery(activeBusinessId)));
      if (!data) return;
      const drafts = data.drafts || [];
      if (!drafts.length) {
        body.innerHTML = '<div class="card"><div class="empty">No hay respuestas pendientes de revisión.</div></div>';
        return;
      }
      body.innerHTML = `<div class="card">
        <div class="card-head"><div>
          <div class="card-title">Respuestas pendientes</div>
          <div class="card-sub">${drafts.length} pendiente(s)</div>
        </div></div>
        <div id="drafts-list"></div>
      </div>`;
      const list = $('drafts-list');
      drafts.forEach(d => {
        const div = document.createElement('div');
        div.className = 'auto-card';
        div.style.marginBottom = '12px';
        div.innerHTML = `
          <div class="auto-card-body">
            <div class="auto-name">${escHtml(d.reviewer_name || 'Anónimo')}${d.rating ? ' · ' + escHtml(d.rating) : ''}</div>
            <div class="auto-desc" style="margin-bottom:8px">${escHtml(d.source_text || '')}</div>
            <textarea class="draft-text">${escHtml(d.suggested_reply)}</textarea>
          </div>
          <div class="auto-footer">
            <span class="auto-status off">○ Pendiente</span>
            <div style="display:flex;gap:8px">
              <button class="btn sm danger" data-action="reject">Rechazar</button>
              <button class="btn sm primary" data-action="approve">Aprobar y enviar</button>
            </div>
          </div>`;
        div.querySelector('[data-action="approve"]').addEventListener('click', () => resolveDraft(d.draft_id, 'approve', div));
        div.querySelector('[data-action="reject"]').addEventListener('click', () => resolveDraft(d.draft_id, 'reject', div));
        list.appendChild(div);
      });
    } catch (e) {
      body.innerHTML = `<div class="card"><div class="empty">Error cargando borradores.</div></div>`;
    }
  }

  async function renderReviewsHistory(body) {
    try {
      const data = await api('GET', withQuery('/client/automations/google_reviews/drafts', bizQuery(activeBusinessId)));
      if (!data) return;
      const drafts = (data.drafts || []).filter(d => d.status !== 'pending');
      if (!drafts.length) {
        body.innerHTML = '<div class="card"><div class="empty">Aún no hay historial de respuestas.</div></div>';
        return;
      }
      body.innerHTML = `<div class="card">
        <div class="card-head"><div>
          <div class="card-title">Historial</div>
          <div class="card-sub">${drafts.length} respuesta(s)</div>
        </div></div>
        <div id="hist-list"></div>
      </div>`;
      const list = $('hist-list');
      drafts.forEach(d => {
        const div = document.createElement('div');
        div.className = 'hist-row';
        const reply = d.final_reply || d.suggested_reply || '';
        div.innerHTML = `
          <div class="hist-meta">
            <strong>${escHtml(d.reviewer_name || 'Anónimo')}</strong>
            · ${escHtml(statusLabel(d.status))}
            · ${dateStr(d.updated_at || d.created_at)}
          </div>
          <div class="auto-desc" style="margin-bottom:6px">${escHtml(d.source_text || '')}</div>
          <div class="hist-body">${escHtml(reply)}</div>`;
        list.appendChild(div);
      });
    } catch (e) {
      body.innerHTML = `<div class="card"><div class="empty">Error cargando historial.</div></div>`;
    }
  }

  async function resolveDraft(draftId, action, cardEl) {
    try {
      if (action === 'approve') {
        const text = cardEl.querySelector('.draft-text').value;
        await api('POST', `/client/drafts/${encodeURIComponent(draftId)}/approve`, { final_reply: text });
        toast('Respuesta enviada a Google', 'ok');
      } else {
        await api('POST', `/client/drafts/${encodeURIComponent(draftId)}/reject`);
        toast('Respuesta rechazada');
      }
      reviewsSubtab = 'pending';
      await loadWorkspace();
    } catch (e) {
      toast(e.message, 'err');
    }
  }

  async function connectGoogle() {
    try {
      const r = await api('GET', '/client/google/connect');
      if (r && r.redirect_url) window.location.href = r.redirect_url;
    } catch (e) { toast(e.message, 'err'); }
  }

  async function disconnectGoogle() {
    if (!confirm('¿Desconectar Google Business? Las automatizaciones que lo usen dejarán de funcionar hasta que vuelvas a conectar.')) {
      return;
    }
    try {
      await api('DELETE', '/client/google/disconnect');
      toast('Google desconectado', 'ok');
      await loadWorkspace();
    } catch (e) { toast(e.message, 'err'); }
  }

  async function renderAccounts(c) {
    try {
      const data = await api('GET', '/client/accounts/status');
      if (!data) return;
      const accounts = data.accounts || [];
      c.innerHTML = `<div class="card">
        <div class="card-head"><div>
          <div class="card-title">Conectar cuentas</div>
          <div class="card-sub">Vincula las plataformas que usan tus automatizaciones</div>
        </div></div>
        <div id="accounts-list"></div>
      </div>`;
      const list = $('accounts-list');
      accounts.forEach(acc => {
        const icon = ACCOUNT_ICONS[acc.provider] || '';
        const desc = ACCOUNT_DESC[acc.provider] || '';
        const div = document.createElement('div');
        div.className = 'auto-card';
        div.style.marginBottom = '12px';
        let actions = '';
        if (acc.connected) {
          actions = `<button class="btn sm danger" data-disconnect="${escHtml(acc.provider)}">Desconectar</button>`;
        } else if (acc.connectable && acc.provider === 'google') {
          actions = `<button class="btn sm primary" data-connect="google">Conectar →</button>`;
        } else {
          actions = `<button class="btn sm ghost" disabled>Próximamente</button>`;
        }
        div.innerHTML = `
          <div class="auto-card-body">
            <div class="google-box-head" style="margin-bottom:8px">
              ${icon}
              <div>
                <div class="auto-name">${escHtml(acc.label)}</div>
                <div class="auto-desc">${escHtml(desc)}</div>
              </div>
            </div>
            ${acc.connected ? `<div class="google-box-meta">
              Cuenta: <strong>${escHtml(acc.account_label || '—')}</strong><br/>
              Conectado el: ${dateStr(acc.connected_at)}
            </div>` : ''}
          </div>
          <div class="auto-footer">
            <span class="auto-status ${acc.connected ? 'on' : 'off'}">${acc.connected ? '● Conectado' : '○ No conectado'}</span>
            ${actions}
          </div>`;
        const connectBtn = div.querySelector('[data-connect="google"]');
        if (connectBtn) connectBtn.addEventListener('click', connectGoogle);
        const discBtn = div.querySelector('[data-disconnect]');
        if (discBtn) {
          discBtn.addEventListener('click', () => {
            if (discBtn.dataset.disconnect === 'google') disconnectGoogle();
            else toast('Desconexión no disponible todavía', 'err');
          });
        }
        list.appendChild(div);
      });
    } catch (e) {
      c.innerHTML = `<div class="card"><div class="empty">Error cargando cuentas. Recarga la página.</div></div>`;
    }
  }

  function showLogin() {
    $('view-login').style.display = '';
    $('view-register').style.display = 'none';
    $('inp-email').focus();
  }
  function showRegister() {
    $('view-login').style.display = 'none';
    $('view-register').style.display = '';
    $('reg-name').focus();
  }

  async function tryRegister() {
    const name = $('reg-name').value.trim();
    const email = $('reg-email').value.trim();
    const password = $('reg-password').value;
    $('register-error').textContent = '';
    if (!name || !email || !password) { $('register-error').textContent = 'Completa todos los campos.'; return; }
    if (password.length < 8) { $('register-error').textContent = 'La contraseña debe tener al menos 8 caracteres.'; return; }
    const btn = $('btn-register');
    btn.disabled = true; btn.textContent = 'Creando cuenta…';
    try {
      const r = await fetch('/client/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || 'Error al registrar');
      token = data.token;
      currentClient = data.client;
      localStorage.setItem(TOKEN_KEY, token);
      showApp();
    } catch (e) {
      $('register-error').textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = 'Crear cuenta →';
    }
  }

  $('btn-login').addEventListener('click', tryLogin);
  $('inp-password').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  $('btn-register').addEventListener('click', tryRegister);
  $('reg-password').addEventListener('keydown', e => { if (e.key === 'Enter') tryRegister(); });
  $('btn-logout').addEventListener('click', doLogout);
  $('btn-home').addEventListener('click', () => { window.location.href = '/'; });

  (async () => {
    const params = new URLSearchParams(window.location.search);
    const activatedType = params.get('activated');
    if (activatedType) {
      const lbl = AUTOMATION_LABELS[activatedType] || { name: activatedType };
      toast(`Automatización activada ✓ — ${lbl.name}`, 'ok');
      activeView = activatedType;
    } else if (params.get('checkout') === 'paid') {
      toast('Pago recibido. Completa la conexión de Google para activar.', 'ok');
    } else if (params.get('connected') === '1') {
      toast('Google Business conectado correctamente', 'ok');
      activeView = 'accounts';
    }
    if (params.get('checkout') === 'error') toast('No se pudo confirmar el pago. Inténtalo de nuevo.', 'err');
    if (params.get('error') === 'oauth_failed') toast('Error al conectar Google. Inténtalo de nuevo.', 'err');

    if (params.get('connect') === 'google' && localStorage.getItem('mz_client_token')) {
      try {
        const r = await fetch('/client/google/connect', {
          headers: { Authorization: 'Bearer ' + localStorage.getItem('mz_client_token') },
        });
        if (r.ok) {
          const d = await r.json();
          if (d.redirect_url) { window.location.href = d.redirect_url; return; }
        }
      } catch {}
    }

    const ok = await tryRestoreSession();
    if (ok) showApp();
    else { $('login-overlay').classList.remove('hidden'); $('inp-email').focus(); }
  })();
})();
</script>
</body>
</html>
