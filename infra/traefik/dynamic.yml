# Rutas nuevas de exmanual.com. Upstream: servicio Docker api, puerto 8090.
# No se monta en el Traefik de Hostinger y no redefine app.srv1255804.
# certResolver letsencrypt no está leído del VPS: docker-compose.vps.yml no está en git.
http:
  routers:
    exmanual:
      rule: Host(`exmanual.com`)
      entryPoints:
        - websecure
      service: zeromanual
      tls:
        certResolver: letsencrypt
    exmanual-www:
      rule: Host(`www.exmanual.com`)
      entryPoints:
        - websecure
      middlewares:
        - exmanual-www-redirect
      service: zeromanual
      tls:
        certResolver: letsencrypt
  middlewares:
    exmanual-www-redirect:
      redirectRegex:
        regex: ^https://www\.exmanual\.com/(.*)
        replacement: https://exmanual.com/${1}
        permanent: true
  services:
    zeromanual:
      loadBalancer:
        servers:
          - url: http://api:8090
