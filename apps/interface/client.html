<!DOCTYPE html>
<html lang="es" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroManual · Portal de cliente</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='none' stroke='%230e1116' stroke-width='2'/><circle cx='16' cy='16' r='8' fill='%234f46e5'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f6f7f9; --bg-2: #eff1f4; --bg-3: #e9edf3; --line: #e6e9ee;
      --fg: #0e1116; --fg-2: #3a4150; --fg-3: #6b7280;
      --accent: #4f46e5; --accent-h: #4338ca; --accent-soft: #eef0fe;
      --ok: #047857; --ok-soft: #e3f3eb; --warn: #b7791f; --err: #e5484d;
      --star: #e8a317;
      --r: 14px; --r-sm: 10px;
      --shadow: 0 1px 2px rgba(14,17,22,0.04), 0 8px 24px rgba(14,17,22,0.06);
      --font: 'IBM Plex Sans', system-ui, sans-serif;
      --display: 'Space Grotesk', system-ui, sans-serif;
      --sidebar-w: 240px;
    }
    .login-brand-name, .topbar-brand-name, .login-title, .card-title, .auto-name, .google-box-title,
    .page-head h1, .stat strong, .list-bar-info strong { font-family: var(--display); }
    .login-title { font-size: 22px; letter-spacing: -.01em; }
    .auto-card { border-radius: var(--r-sm); }
    .btn { font-weight: 600; }
    html, body { height: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    #login-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; transition: opacity .2s;
    }
    #login-overlay.hidden { opacity: 0; pointer-events: none; }
    .login-card {
      background: #fff; border: 1px solid var(--line); border-radius: var(--r);
      box-shadow: var(--shadow); padding: 40px 36px; width: 340px;
    }
    .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .login-brand-mark {
      width: 28px; height: 28px; border: 1.5px solid var(--fg); border-radius: 50%;
      position: relative; display: inline-block; flex-shrink: 0;
    }
    .login-brand-mark::after {
      content: ""; position: absolute; inset: 5px;
      background: var(--accent); border-radius: 50%; animation: pulse 2.4s ease-in-out infinite;
    }
    .login-brand-name { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
    .login-brand-name span { font-weight: 300; }
    .login-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .login-sub { color: var(--fg-3); margin-bottom: 24px; font-size: 13px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--fg-2); margin-bottom: 5px; }
    .form-group input {
      width: 100%; padding: 9px 11px; background: var(--bg); border: 1px solid var(--line);
      border-radius: var(--r-sm); font: inherit; font-size: 14px; color: var(--fg);
      outline: none; transition: border-color .15s;
    }
    .form-group input:focus { border-color: var(--accent); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px;
      border-radius: var(--r-sm); border: 1px solid transparent; font: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
      transition: background .15s, border-color .15s, color .15s; white-space: nowrap;
    }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-h); }
    .btn.ghost { background: #fff; border-color: var(--line); color: var(--fg-2); }
    .btn.ghost:hover { background: var(--bg-2); }
    .btn.danger { background: transparent; border-color: var(--err); color: var(--err); }
    .btn.danger:hover { background: var(--err); color: #fff; }
    .btn.sm { padding: 5px 10px; font-size: 12px; }
    .btn.full { width: 100%; justify-content: center; margin-top: 8px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn svg { width: 14px; height: 14px; }
    .btn-link {
      background: none; border: none; font: inherit; font-size: 12.5px; font-weight: 500;
      color: var(--fg-3); cursor: pointer; padding: 6px 8px; border-radius: 6px;
    }
    .btn-link:hover { color: var(--fg-2); background: var(--bg-2); }
    .btn-link.danger { color: var(--err); }
    .btn-link.danger:hover { background: #fde8ec; }
    .error-msg { color: var(--err); font-size: 12px; margin-top: 8px; min-height: 16px; }
    #app { display: flex; height: 100%; min-height: 0; }
    .topbar-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--fg); }
    .topbar-brand-mark {
      width: 22px; height: 22px; border: 1.5px solid var(--fg); border-radius: 50%;
      position: relative; display: inline-block; flex-shrink: 0;
    }
    .topbar-brand-mark::after {
      content: ""; position: absolute; inset: 4px;
      background: var(--accent); border-radius: 50%; animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.55); opacity: 0.7; } }
    .topbar-brand-name { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
    .topbar-brand-name span { font-weight: 300; }
    .workspace { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .m-brandbar { display: none; }
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0; background: #fff; border-right: 1px solid var(--line);
      display: flex; flex-direction: column; padding: 18px 12px 14px; overflow: visible;
    }
    .sidebar .topbar-brand { padding: 4px 8px 20px; }
    .sidebar-nav { flex: 1; min-height: 0; overflow-y: auto; }
    .nav-chev { margin-left: auto; width: 14px; height: 14px; display: inline-flex; color: var(--fg-3); }
    .nav-chev svg { width: 14px; height: 14px; }
    .nav-item.open .nav-chev { transform: rotate(90deg); color: var(--accent); }
    .nav-sub { padding: 2px 0 8px 12px; }
    .nav-sub .nav-item { position: relative; padding: 7px 10px 7px 14px; font-size: 12.5px; }
    .nav-sub .nav-item::before {
      content: ""; position: absolute; left: 0; top: 50%; width: 8px; height: 1px; background: var(--line);
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 9px 10px; border: none; background: transparent; border-radius: var(--r-sm);
      cursor: pointer; font: inherit; font-size: 13px; font-weight: 500; color: var(--fg-2);
      margin-bottom: 2px; transition: background .12s, color .12s;
    }
    .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; color: var(--fg-3); }
    .nav-item:hover { background: var(--bg-2); color: var(--fg); }
    .nav-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .nav-item.on svg { color: var(--accent); }
    .nav-badge {
      margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--accent); color: #fff; font-size: 10px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .sidebar-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); position: relative; }
    .user-chip {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; width: 100%;
      border: none; background: transparent; border-radius: var(--r-sm); cursor: pointer;
      font: inherit; color: inherit; text-align: left;
    }
    .user-chip:hover, .user-chip.open { background: var(--bg-2); }
    .user-chip .chev-up { width: 14px; height: 14px; color: var(--fg-3); flex-shrink: 0; margin-left: auto; }
    .user-chip .chev-up svg { width: 14px; height: 14px; }
    .avatar-menu {
      position: absolute; bottom: calc(100% + 6px); left: 0; right: 0; background: #fff;
      border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(14,17,22,.12);
      padding: 6px; z-index: 40;
    }
    .avatar-menu[hidden] { display: none; }
    .avatar-menu button {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 10px 12px; border: none; background: transparent; border-radius: 8px;
      font: inherit; font-size: 13px; font-weight: 500; color: var(--fg-2); cursor: pointer;
    }
    .avatar-menu button svg { width: 16px; height: 16px; color: var(--fg-3); }
    .avatar-menu button:hover { background: var(--bg-2); color: var(--fg); }
    .avatar-menu button.danger, .avatar-menu button.danger svg { color: var(--err); }
    .avatar-menu .sep { height: 1px; background: var(--line); margin: 4px 6px; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft);
      display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--accent); flex-shrink: 0;
    }
    .user-meta { min-width: 0; }
    .user-meta strong, .user-meta span {
      display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px;
    }
    .user-meta strong { font-size: 12.5px; font-weight: 600; }
    .user-meta span { font-size: 11px; color: var(--fg-3); }
    .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    .page-head { background: #fff; border-bottom: 1px solid var(--line); padding: 16px 28px; flex-shrink: 0; }
    .page-head h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
    .page-lead { font-size: 13px; color: var(--fg-3); margin-top: 3px; max-width: 460px; }
    .page-body { flex: 1; overflow-y: auto; padding: 18px 28px 48px; }
    .reviews-head {
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "title toggle" "lead hint" "biz biz";
      column-gap: 20px; row-gap: 4px; align-items: start;
    }
    .reviews-titlebar {
      grid-area: title; display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; min-width: 0; flex-wrap: wrap;
    }
    .reviews-titlebar h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
    .reviews-head > .page-lead { grid-area: lead; margin-top: 0; }
    .sub-manage { display: flex; align-items: center; gap: 4px; flex-shrink: 0; margin-left: auto; }
    .link-subtle {
      background: none; border: none; font: inherit; font-size: 12px; font-weight: 500;
      color: var(--fg-3); cursor: pointer; padding: 6px 8px; border-radius: 6px;
    }
    .link-subtle:hover { color: var(--accent); }
    .btn-icon {
      width: 34px; height: 34px; padding: 0; border-radius: 9px; border: 1px solid var(--line);
      background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--fg-2);
    }
    .btn-icon:hover { background: var(--bg-2); }
    .btn-icon svg { width: 16px; height: 16px; }
    .more-wrap { position: relative; }
    .more-menu {
      position: absolute; right: 0; top: calc(100% + 6px); background: #fff; border: 1px solid var(--line);
      border-radius: 12px; box-shadow: 0 8px 28px rgba(14,17,22,.12); padding: 6px;
      min-width: 240px; z-index: 30;
    }
    .more-menu[hidden] { display: none; }
    .more-menu button {
      display: block; width: 100%; text-align: left; padding: 9px 12px; border: none; background: transparent;
      border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500; color: var(--fg-2); cursor: pointer;
    }
    .more-menu button:hover { background: var(--bg-2); }
    .more-menu button.danger { color: var(--err); }
    .more-menu button.muted { color: var(--fg-3); font-size: 12px; }
    .more-menu .sep { height: 1px; background: var(--line); margin: 4px 6px; }
    .reviews-head > .biz-slot { grid-area: biz; margin-top: 6px; }
    .toggle-wrap { display: contents; }
    .toggle-card {
      grid-area: toggle; justify-self: end;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm);
    }
    .toggle-label { font-size: 12px; font-weight: 600; color: var(--fg); text-align: right; white-space: nowrap; }
    .toggle-label small { display: block; font-weight: 400; color: var(--fg-3); font-size: 11px; }
    .toggle-hint {
      grid-area: hint; justify-self: end; font-size: 11px; color: var(--fg-3);
      text-align: right; line-height: 1.35; max-width: 250px;
    }
    .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .slider { position: absolute; inset: 0; background: #c1c9d2; border-radius: 22px; cursor: pointer; transition: .2s; }
    .slider::before {
      content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }
    .biz-pill, .biz-select {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px;
      background: var(--bg-2); border: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--fg-2);
    }
    .biz-select { font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .tabs { display: flex; gap: 4px; background: var(--bg-2); padding: 3px; border-radius: var(--r-sm); }
    .tab {
      padding: 7px 14px; border-radius: 8px; border: none; background: transparent;
      font: inherit; font-size: 13px; font-weight: 500; color: var(--fg-3); cursor: pointer;
    }
    .tab.on { background: #fff; color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .tab:disabled, .tab.disabled {
      opacity: .45; color: var(--fg-3); cursor: not-allowed; pointer-events: none; font-weight: 500;
    }
    .tab-count {
      display: inline-flex; align-items: center; justify-content: center; margin-left: 6px;
      min-width: 18px; height: 16px; padding: 0 5px; border-radius: 8px;
      background: #eef0fe; color: #6366a8; font-size: 10px; font-weight: 600; vertical-align: middle;
    }
    .tab:not(.on) .tab-count { background: #eef1f4; color: #6b7280; }
    .search {
      display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: transparent;
      border-radius: 8px; color: var(--fg-3); margin-left: auto;
    }
    .search:focus-within { background: var(--bg-2); }
    .search svg { width: 15px; height: 15px; flex-shrink: 0; }
    .search input {
      border: none; background: transparent; font: inherit; font-size: 13px; color: var(--fg);
      outline: none; width: 150px;
    }
    .search input::placeholder { color: var(--fg-3); }
    .stars-filter { display: flex; gap: 4px; align-items: center; }
    .chip {
      padding: 5px 9px; border-radius: 16px; border: none; background: transparent;
      font: inherit; font-size: 12px; font-weight: 500; color: var(--fg-3); cursor: pointer;
    }
    .chip.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .star-select { display: none; }
    .list-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin-bottom: 16px; padding: 12px 16px; background: #fff; border: 1px solid var(--line);
      border-radius: var(--r); box-shadow: var(--shadow);
    }
    .list-bar-info strong { font-size: 14px; font-weight: 600; display: block; }
    .list-bar-info span { font-size: 12px; color: var(--fg-3); }
    .day-sep {
      position: sticky; top: 0; z-index: 2; padding: 10px 2px 8px;
      font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
      color: var(--fg-3); background: linear-gradient(var(--bg) 70%, transparent); margin-top: 6px;
    }
    .pair-list { display: flex; flex-direction: column; gap: 14px; }
    .pair { display: grid; grid-template-columns: 1fr 28px 1fr; align-items: stretch; }
    .block {
      background: #fff; border: 1px solid var(--line); border-radius: var(--r);
      box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; display: flex; flex-direction: column;
    }
    .block.proposal { background: #fafbfd; }
    .connector { display: flex; align-items: center; justify-content: center; color: var(--fg-3); }
    .connector svg { width: 18px; height: 18px; opacity: .55; }
    .col-label {
      display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px;
    }
    .col-label svg { width: 14px; height: 14px; }
    .proposal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .proposal-head .col-label { margin-bottom: 0; }
    .tag { font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
    .tag.pending { color: var(--warn); background: #faf0da; }
    .tag.approved { color: var(--ok); background: var(--ok-soft); }
    .tag.edited { color: var(--accent); background: var(--accent-soft); }
    .tag.auto { color: var(--ok); background: var(--ok-soft); }
    .tag.rejected { color: var(--err); background: #fde8ec; }
    .reviewer { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .reviewer-av {
      width: 34px; height: 34px; border-radius: 50%; background: var(--bg-2);
      display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--fg-2); flex-shrink: 0;
    }
    .reviewer-name { font-weight: 600; font-size: 14px; }
    .stars { color: var(--star); letter-spacing: 1px; font-size: 13px; margin-top: 1px; }
    .review-text { font-size: 14px; color: var(--fg-2); line-height: 1.55; padding: 10px 12px; background: var(--bg); border-radius: var(--r-sm); white-space: pre-wrap; }
    .review-text.empty { color: var(--fg-3); font-style: italic; }
    .draft-text {
      width: 100%; min-height: 88px; padding: 11px 13px; border: 1.5px solid var(--line);
      border-radius: var(--r-sm); font: inherit; font-size: 13.5px; color: var(--fg);
      line-height: 1.55; background: #fff; resize: vertical; outline: none; flex: 1;
    }
    .draft-text:focus { border-color: var(--accent); }
    .reply-published {
      font-size: 13.5px; color: var(--fg-2); line-height: 1.55; padding: 11px 13px;
      background: #fff; border: 1px solid var(--line); border-radius: var(--r-sm); flex: 1; white-space: pre-wrap;
    }
    .proposal-actions { display: flex; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .actions-spacer { flex: 1; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(14,17,22,.45); display: flex;
      align-items: center; justify-content: center; z-index: 300; backdrop-filter: blur(2px);
    }
    .modal {
      background: #fff; border-radius: var(--r); padding: 26px 26px 20px; width: 440px;
      max-width: calc(100% - 32px); box-shadow: var(--shadow); border: 1px solid var(--line);
    }
    .modal-icon {
      width: 40px; height: 40px; border-radius: 10px; background: #faf0da; color: var(--warn);
      display: grid; place-items: center; margin-bottom: 14px;
    }
    .modal-icon svg { width: 20px; height: 20px; }
    .modal h2 { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 8px; }
    .modal p { font-size: 13.5px; color: var(--fg-2); line-height: 1.5; margin-bottom: 14px; }
    .modal-check {
      display: flex; align-items: flex-start; gap: 10px; padding: 12px; background: var(--bg);
      border-radius: var(--r-sm); margin-bottom: 18px; font-size: 13px; color: var(--fg-2); line-height: 1.4;
    }
    .modal-check input { margin-top: 3px; accent-color: var(--accent); }
    .modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .modal-actions .btn { font-size: 12.5px; padding: 8px 12px; }
    .bottom-nav { display: none; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
    .card-title { font-size: 13px; font-weight: 600; }
    .card-sub { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat {
      background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px;
      box-shadow: var(--shadow); text-align: left; cursor: pointer; font: inherit; color: inherit; width: 100%;
    }
    .stat:hover { border-color: var(--accent); }
    .stat strong { font-size: 22px; font-weight: 600; display: block; }
    .stat span { font-size: 12px; color: var(--fg-3); }
    .auto-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .auto-card {

    alert: svg('<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/>', '2'),
  };

  const $ = id => document.getElementById(id);
  let toastTimer = null;

  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'show' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 3200);
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
  }

  async function api(method, path, body) {
    const opts = { method, headers: authHeaders() };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch(path, opts);
    if (r.status === 401) { doLogout(); return null; }
    if (!r.ok) {
      const t = await r.text();
      let detail = t;
      try { detail = JSON.parse(t).detail || t; } catch (err) { detail = t; }
      throw new Error(detail);
    }
    return r.json();
  }

  function dateStr(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
  }

  function statusLabel(st) {
    const map = {
      pending: 'Pendiente', approved: 'Aprobada por ti', edited: 'Editada por ti',
      rejected: 'Rechazada', auto_sent: 'Automática', failed: 'Fallida',
    };
    return map[st] || st;
  }

  function clientLabel() {
    if (!currentClient) return '—';
    return currentClient.business_name || currentClient.name || currentClient.email || '—';
  }

  function initials(name) {
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '·';
    const a = parts[0].charAt(0);
    const b = parts.length > 1 ? parts[1].charAt(0) : parts[0].charAt(1);
    return (a + b).toUpperCase();
  }

  function badgeText(n) {
    if (!n || n <= 0) return '';
    return n > 9 ? '+9' : String(n);
  }

  function ratingNumber(rating) {
    if (rating == null || rating === '') return 0;
    const key = String(rating).trim().toUpperCase();
    if (STAR_WORDS[key]) return STAR_WORDS[key];
    const n = Number(key);
    if (!Number.isFinite(n)) return 0;
    return Math.max(0, Math.min(5, Math.round(n)));
  }

  function starsHtml(rating) {
    const n = ratingNumber(rating);
    if (!n) return '';
    return '★'.repeat(n) + '☆'.repeat(5 - n);
  }

  function dayLabel(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return 'Sin fecha';
    const start = dt => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime();
    const diff = Math.round((start(new Date()) - start(d)) / 86400000);
    if (diff === 0) return 'Hoy';
    if (diff === 1) return 'Ayer';
    return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })
      .replace(/\./g, '').replace(/\s+de\s+/gi, ' ').toLowerCase();
  }

  function isThisMonth(iso) {
    if (!iso) return false;
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return false;
    const n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth();
  }

  function activeReviewRows() {
    return ((cachedAutos && cachedAutos.active) || []).filter(
      a => a.automation_type === 'google_reviews' && a.status === 'active'
    );
  }

  function currentReviewRow() {
    const rows = activeReviewRows();
    return rows.find(r => r.business_id === activeBusinessId) || rows[0] || null;
  }

  function pendingDrafts() {
    return cachedDrafts.filter(d => d.status === 'pending');
  }

  function effectiveSubtab() {
    if (pendingReviewCount === 0) return 'history';
    return reviewsSubtab === 'history' ? 'history' : 'pending';
  }

  function modeCopy() {
    if (replyMode === 'auto') {
      return { state: 'Activadas', hint: 'ZeroManual publica las respuestas por ti' };
    }
    return { state: 'Desactivadas', hint: 'Revisas cada respuesta antes de publicarla' };
  }

  function reviewsLead() {
    if (pendingReviewCount === 0) return 'No hay propuestas pendientes. Consulta el historial de respuestas.';
    return 'Revisa cada propuesta y publícala cuando esté lista.';
  }

  function draftMatches(d) {
    const q = reviewQuery.trim().toLowerCase();
    if (q && String(d.reviewer_name || '').toLowerCase().indexOf(q) === -1) return false;
    if (reviewStars && ratingNumber(d.rating) !== reviewStars) return false;
    return true;
  }

  function visibleDrafts(which) {
    return cachedDrafts
      .filter(d => (which === 'pending' ? d.status === 'pending' : d.status !== 'pending'))
      .filter(draftMatches)
      .sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
  }

  function captureEdits() {
    document.querySelectorAll('[data-draft-id]').forEach(node => {
      const ta = node.querySelector('.draft-text');
      if (ta && node.dataset.draftId) draftEdits[node.dataset.draftId] = ta.value;
    });
  }

  function replyTextFor(d) {
    const nodes = document.querySelectorAll('[data-draft-id]');
    for (let i = 0; i < nodes.length; i++) {
      if (nodes[i].dataset.draftId === d.draft_id) {
        const ta = nodes[i].querySelector('.draft-text');
        if (ta) return ta.value;
      }
    }
    if (Object.prototype.hasOwnProperty.call(draftEdits, d.draft_id)) return draftEdits[d.draft_id];
    return d.suggested_reply || '';
  }

  function pageChrome(title, lead) {
    return `<header class="page-head simple"><h1>${escHtml(title)}</h1>${lead ? `<p class="page-lead">${escHtml(lead)}</p>` : ''}</header>`;
  }

  async function tryLogin() {
    const email = $('inp-email').value.trim(), password = $('inp-password').value;
    $('login-error').textContent = '';
    if (!email || !password) { $('login-error').textContent = 'Completa el email y la contraseña.'; return; }
    const btn = $('btn-login');
    btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      const r = await fetch('/client/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || 'Error de autenticación');
      token = data.token;
      currentClient = data.client || data.user;
      localStorage.setItem(TOKEN_KEY, token);
      showApp();
    } catch (e) {
      $('login-error').textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = 'Entrar →';
    }
  }

  async function doLogout() {
    if (token) {
      try { await fetch('/client/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }); } catch (err) { /* sesión ya inválida */ }
    }
    token = null; currentClient = null;
    localStorage.removeItem(TOKEN_KEY);
    window.location.href = '/';
  }

  async function tryRestoreSession() {
    if (!token) return false;
    try {
      const r = await fetch('/client/me', { headers: { 'Authorization': `Bearer ${token}` } });
      if (!r.ok) { token = null; localStorage.removeItem(TOKEN_KEY); return false; }
      const data = await r.json();
      currentClient = data.client || data.user;
      return true;
    } catch (err) { return false; }
  }

  async function applyPendingActivations() {
    let pending;
    try { pending = JSON.parse(localStorage.getItem(CART_HANDOFF_KEY) || '[]'); } catch (err) { pending = []; }
    if (!Array.isArray(pending) || !pending.length) return;
    let activated = 0;
    const failed = [];
    let lastError = '';
    for (const type of pending) {
      try { await api('POST', `/client/automations/${encodeURIComponent(type)}/activate`); activated++; }
      catch (e) { failed.push(type); lastError = e.message || 'Error desconocido'; }
    }
    if (failed.length) localStorage.setItem(CART_HANDOFF_KEY, JSON.stringify(failed));
    else localStorage.removeItem(CART_HANDOFF_KEY);
    if (activated) toast(`${activated} automatización(es) activada(s)`, 'ok');
    if (failed.length) toast(`No se pudo activar: ${lastError}`, 'err');
  }

  async function showApp() {
    $('login-overlay').classList.add('hidden');
    await applyPendingActivations();
    await loadWorkspace();
  }

  async function fetchAutomations() {
    const data = await api('GET', '/client/automations');
    if (!data) return null;
    cachedAutos = data;
    return data;
  }

  async function fetchBusinesses() {
    try {
      const data = await api('GET', '/client/businesses');
      cachedBusinesses = (data && data.businesses) || [];
    } catch (e) {
      cachedBusinesses = [];
      if (e && e.message) toast(e.message, 'err');
    }
    return cachedBusinesses;
  }

  function bizQuery(businessId) {
    return businessId ? `business_id=${encodeURIComponent(businessId)}` : '';
  }

  function withQuery(path, query) {
    if (!query) return path;
    return path + (path.includes('?') ? '&' : '?') + query;
  }

  async function refreshReviewCache() {
    reviewLoadError = '';
    const rows = activeReviewRows();
    if (!rows.length) {
      cachedDrafts = [];
      pendingReviewCount = 0;
      return;
    }
    if (!activeBusinessId || !rows.some(r => r.business_id === activeBusinessId)) {
      activeBusinessId = rows[0].business_id;
    }
    try {
      const data = await api('GET', withQuery('/client/automations/google_reviews/drafts', bizQuery(activeBusinessId)));
      cachedDrafts = (data && data.drafts) || [];
      pendingReviewCount = pendingDrafts().length;
    } catch (e) {
      cachedDrafts = [];
      pendingReviewCount = 0;
      reviewLoadError = e.message || 'Error cargando propuestas';
    }
  }

  function reviewRefreshPlan(input) {
    const now = input.now;
    const onReviews = input.activeView === 'google_reviews' && !!input.hasAutomation;
    const justActivated = !!(input.activatedAt && (now - input.activatedAt) < REVIEW_WATCH_MS);
    const emptyPending = !input.pendingCount;
    let watchUntil = input.watchUntil || 0;
    if (input.arm) {
      if (onReviews && (justActivated || emptyPending)) {
        const fromActivation = justActivated ? input.activatedAt + REVIEW_WATCH_MS : 0;
        const fromEmpty = emptyPending ? now + REVIEW_WATCH_MS : 0;
        watchUntil = Math.max(fromActivation, fromEmpty);
      } else {
        watchUntil = 0;
      }
    }
    return {
      pollMs: REVIEW_POLL_MS,
      watchMs: REVIEW_WATCH_MS,
      watchUntil: watchUntil,
      schedulePoll: onReviews && now < watchUntil,
      refetch: onReviews && input.visibility !== 'hidden' && input.reason !== 'arm',
    };
  }

  function currentReviewInput(extra) {
    return Object.assign({
      now: Date.now(),
      activeView: activeView,
      hasAutomation: activeReviewRows().length > 0,
      pendingCount: pendingReviewCount,
      activatedAt: reviewsActivatedAt,
      watchUntil: reviewWatchUntil,
      visibility: document.visibilityState,
      reason: 'resume',
      arm: false,
    }, extra || {});
  }

  function draftsSignature(list) {
    return (list || []).map(function (d) {
      return [
        d.draft_id, d.status, d.updated_at, d.suggested_reply, d.final_reply,
        d.reviewer_name, d.rating, d.source_text, d.created_at,
      ].join('\u0001');
    }).join('\u0002');
  }

  function captureReviewFocus() {
    const el = document.activeElement;
    if (!el || !el.closest || !el.classList || !el.classList.contains('draft-text')) return null;
    const pair = el.closest('[data-draft-id]');
    if (!pair) return null;
    return { draftId: pair.dataset.draftId, start: el.selectionStart, end: el.selectionEnd };
  }

  function restoreReviewFocus(focus) {
    if (!focus) return;
    const nodes = document.querySelectorAll('[data-draft-id]');
    for (let i = 0; i < nodes.length; i++) {
      if (nodes[i].dataset.draftId !== focus.draftId) continue;
      const ta = nodes[i].querySelector('.draft-text');
      if (!ta) return;
      ta.focus();
      if (typeof focus.start === 'number' && ta.setSelectionRange) ta.setSelectionRange(focus.start, focus.end);
      return;
    }
  }

  function stopReviewPoll() {
    if (reviewPollTimer) {
      clearTimeout(reviewPollTimer);
      reviewPollTimer = null;
    }
  }

  function scheduleReviewPoll() {
    if (reviewPollTimer) return;
    reviewPollTimer = setTimeout(function () {
      reviewPollTimer = null;
      refreshOpenReviews('poll');
    }, REVIEW_POLL_MS);
  }

  function applyReviewPlan(plan) {
    reviewWatchUntil = plan.watchUntil;
    if (plan.schedulePoll) scheduleReviewPoll();
    else stopReviewPoll();
  }

  function armReviewWatch() {
    applyReviewPlan(reviewRefreshPlan(currentReviewInput({ reason: 'arm', arm: true })));
  }

  async function runReviewRefresh() {
    const beforeSig = draftsSignature(cachedDrafts);
    const beforeCount = pendingReviewCount;
    const beforeErr = reviewLoadError;
    const focus = captureReviewFocus();
    try {
      await refreshReviewCache();
      if (activeView === 'google_reviews' && $('review-list')) {
        const changed = draftsSignature(cachedDrafts) !== beforeSig
          || pendingReviewCount !== beforeCount
          || reviewLoadError !== beforeErr;
        if (changed) {
          syncChrome();
          paintReviewList();
          if (beforeCount !== pendingReviewCount) renderNav();
          restoreReviewFocus(focus);
        }
      }
    } finally {
      applyReviewPlan(reviewRefreshPlan(currentReviewInput({ reason: 'poll', arm: false })));
    }
  }

  async function refreshOpenReviews(reason) {
    const plan = reviewRefreshPlan(currentReviewInput({ reason: reason || 'resume', arm: false }));
    if (!token || !plan.refetch) {
      applyReviewPlan(plan);
      return;
    }
    if (reviewRefreshInFlight) return reviewRefreshInFlight;
    reviewRefreshInFlight = runReviewRefresh().finally(function () {
      reviewRefreshInFlight = null;
    });
    return reviewRefreshInFlight;
  }

  function onReviewSurfaceResume() {
    if (document.visibilityState === 'hidden') return;
    if (reviewResumeTimer) clearTimeout(reviewResumeTimer);
    reviewResumeTimer = setTimeout(function () {
      reviewResumeTimer = null;
      refreshOpenReviews('resume');
    }, 300);
  }

  async function refreshReplyMode() {
    if (!activeReviewRows().length) { replyMode = 'approval'; return; }
    try {
      const data = await api('GET', withQuery('/client/automations/google_reviews/settings', bizQuery(activeBusinessId)));
      replyMode = (data && data.reply_mode) || 'approval';
    } catch (e) {
      replyMode = 'approval';
    }
  }

  async function loadWorkspace() {
    const c = $('content');
    c.innerHTML = '<div class="loading">Cargando…</div>';
    try {
      const data = await fetchAutomations();
      if (!data) return;
      await fetchBusinesses();
      const active = (data.active || []).filter(a => a.status === 'active');
      const activeTypes = [...new Set(active.map(a => a.automation_type))];
      if (!STATIC_VIEWS.has(activeView) && !activeTypes.includes(activeView)) activeView = 'home';
      await refreshReviewCache();
      if (activeView === 'google_reviews') await refreshReplyMode();
      renderNav();
      await renderPanel(c, data);
      armReviewWatch();
    } catch (e) {
      c.innerHTML = pageChrome('Portal', '') + '<div class="page-body"><div class="card"><div class="empty">Error cargando datos. Recarga la página.</div></div></div>';
    }
  }

  function contractedTypes() {
    const active = ((cachedAutos && cachedAutos.active) || []).filter(a => a.status === 'active');
    const seen = [];
    active.forEach(a => {
      if (a.automation_type && !seen.includes(a.automation_type)) seen.push(a.automation_type);
    });
    return seen;
  }

  function shortAutoName(type) {
    return AUTO_SHORT[type] || (AUTOMATION_LABELS[type] && AUTOMATION_LABELS[type].name) || type;
  }

  function inAutosArea() {
    if (activeView === 'automations' || activeView === 'explore' || activeView === 'google_reviews') return true;
    return contractedTypes().includes(activeView);
  }

  function closeChromeMenus() {
    menuOpen = false;
    sheetOpen = false;
  }

  function renderNav() {
    const badge = badgeText(pendingReviewCount);
    const types = contractedTypes();
    const parentOn = activeView === 'automations' || activeView === 'explore';
    const showSub = autosOpen && types.length > 0;
    const sub = showSub ? `<div class="nav-sub">${types.map(type => {
      const on = activeView === type;
      const mark = type === 'google_reviews' && badge ? `<span class="nav-badge">${escHtml(badge)}</span>` : '';
      const icon = type === 'google_reviews' ? ICO.star : ICO.bolt;
      return `<button class="nav-item${on ? ' on' : ''}" type="button" data-view="${escHtml(type)}">${icon}<span>${escHtml(shortAutoName(type))}</span>${mark}</button>`;
    }).join('')}</div>` : '';
    const items = TOP_NAV.map(item => {

      if (item.view === 'home') on = activeView === 'home';
      else if (item.view === 'accounts') on = activeView === 'accounts' || activeView === 'google';
      else if (item.view === 'automations') on = parentOn;

      const chev = item.view === 'automations' && types.length

      const extra = item.view === 'automations' ? sub : '';
      return `<button class="nav-item${on ? ' on' : ''}${open}" type="button" data-view="${item.view}">${ICO[item.icon]}<span>${escHtml(item.label)}</span>${chev}</button>${extra}`;
    }).join('');
    const name = clientLabel();

    const side = $('sidebar');
    side.innerHTML = `
      <a class="topbar-brand" href="/">

        <div class="topbar-brand-name">Zero<span>Manual</span></div>

          <div class="sep"></div>
          <button type="button" class="danger" id="menu-logout">${ICO.logout}<span>Cerrar sesión</span></button>

      return `<button class="bnav${on ? ' on' : ''}" type="button" data-view="${item.view}">${ICO[item.icon]}<span>${escHtml(item.label)}</span></button>`;
    }).join('') + `<button class="bnav${moreOn ? ' on' : ''}" type="button" id="bnav-more" aria-label="Más"><span class="av-mini">${escHtml(initials(name))}</span><span>Más</span></button>`;
    const sheet = $('more-sheet');

    sheet.hidden = !sheetOpen;
    sheet.innerHTML = `
      <div class="sheet-backdrop" data-close-sheet="1"></div>

          <div class="avatar">${escHtml(initials(name))}</div>
          <div><strong>${escHtml(name)}</strong><span>${escHtml(email)}</span></div>
        </div>

  function goView(view, subtab) {
    closeChromeMenus();
    if (view === 'google') view = 'accounts';
    if (view === 'catalog') view = 'explore';
    activeView = view;
    if (activeView === 'google_reviews') reviewsSubtab = subtab || 'pending';
    if (activeView === 'automations' || activeView === 'google_reviews' || activeView === 'explore') autosOpen = true;
    loadWorkspace();
  }

  async function renderPanel(c, data) {
    if (activeView === 'home') { renderHome(c); return; }
    if (activeView === 'automations') { renderAutomations(c, data); return; }
    if (activeView === 'explore' || activeView === 'catalog') { renderExplore(c, data); return; }
    if (activeView === 'accounts' || activeView === 'google') { await renderAccounts(c); return; }
    if (activeView === 'settings') { renderSettings(c); return; }
    if (activeView === 'google_reviews') { renderGoogleReviews(c); return; }
    const lbl = AUTOMATION_LABELS[activeView] || { name: activeView, desc: '' };
    c.innerHTML = pageChrome(lbl.name, lbl.desc) + `<div class="page-body"><div class="card"><div class="empty">Panel de esta automatización próximamente.</div></div></div>`;
  }

  function renderHome(c) {
    const active = ((cachedAutos && cachedAutos.active) || []).filter(a => a.status === 'active');
    const published = cachedDrafts.filter(d =>
      (d.status === 'approved' || d.status === 'edited' || d.status === 'auto_sent') &&
      isThisMonth(d.updated_at || d.created_at)
    ).length;
    const rows = active.map(a => {
      const lbl = AUTOMATION_LABELS[a.automation_type] || { name: a.automation_type };
      return `<div class="auto-card" style="margin-bottom:12px">
        <div class="auto-card-body">
          <div class="auto-name">${escHtml(lbl.name)}</div>
          <div class="auto-desc">${escHtml(a.business_name || '')}</div>
        </div>

  function activeRowsFor(type) {
    return ((cachedAutos && cachedAutos.active) || []).filter(
      a => a.automation_type === type && a.status === 'active'
    );
  }

  function marketingItems(data) {
    const available = new Set(data.available || []);
    const items = MARKETING.map(item => Object.assign({}, item, { available: available.has(item.key) }));
    (data.available || []).forEach(type => {
      if (!items.some(item => item.key === type)) {
        const lbl = AUTOMATION_LABELS[type] || { name: type, desc: '' };
        items.push({ key: type, name: shortAutoName(type), desc: lbl.desc, tone: 'indigo', icon: 'bolt', available: true });
      }
    });
    return items;
  }

  function productCardHtml(item, interactive) {
    const owned = activeRowsFor(item.key).length > 0;
    const subscribable = !owned && !item.soon && item.available;
    let foot = '<span class="pill soon">Próximamente</span>';
    if (owned) {
      foot = `<span class="pill have">Ya la tienes</span>${interactive ? `<button class="btn sm ghost" type="button" data-open="${escHtml(item.key)}">Abrir</button>` : ''}`;
    } else if (subscribable) {
      foot = `<button class="btn sm primary" type="button" data-type="${escHtml(item.key)}" data-on="false">Suscribirse</button>`;
    }
    const icon = ICO[item.icon] || ICO.bolt;
    return `<article class="product-card" data-product="${escHtml(item.key)}">
      <div class="ico ${escHtml(item.tone || 'indigo')}">${icon}</div>
      <h3>${escHtml(item.name)}</h3>
      <p>${escHtml(item.desc)}</p>
      <div class="foot">${foot}</div>
    </article>`;
  }

  function bindProductGrid(root) {
    root.querySelectorAll('[data-type]').forEach(btn => btn.addEventListener('click', handleAutoBtn));

    root.querySelectorAll('[data-go]').forEach(btn => btn.addEventListener('click', () => goView(btn.dataset.go)));

  async function handleAutoBtn(e) {
    const btn = e.currentTarget;
    const type = btn.dataset.type;
    const isOn = btn.dataset.on === 'true';
    btn.disabled = true;
    try {
      if (isOn) {
        const rows = (cachedAutos && cachedAutos.active || []).filter(
          a => a.automation_type === type && a.status === 'active'
        );
        const businessIds = rows.length ? rows.map(r => r.business_id) : [null];
        for (const bid of businessIds) {
          await api('DELETE', withQuery(`/client/automations/${encodeURIComponent(type)}`, bizQuery(bid)));
        }
        toast('Suscripción cancelada', 'ok');
        if (activeView === type) activeView = 'explore';
      } else if (cachedBusinesses.length > 1) {
        await openBusinessPicker(type, btn);
        return;
      } else {
        const checkout = await api('POST', '/client/checkout/session', {
          automation_types: [type],
          billing_interval: 'monthly',
        });
        if (!checkout) return;
        if (checkout.checkout_url) {
          window.location.href = checkout.checkout_url;
          return;
        }
        if (checkout.mode === 'free') toast('Stripe no configurado — suscripción en modo demo', 'warn');
        await api('POST', `/client/automations/${encodeURIComponent(type)}/activate`);
        toast('Suscripción activada', 'ok');
        activeView = type;
      }
      await loadWorkspace();
    } catch (err) {
      if (err.message && err.message.toLowerCase().includes('google')) {
        const card = btn.closest('.product-card') || btn.closest('.auto-card');
        if (!card) { toast(err.message, 'err'); btn.disabled = false; return; }
        const warn = document.createElement('div');
        warn.className = 'auto-warn';
        warn.innerHTML = `Conecta primero tu cuenta de Google. <a class="goto-google">Ir a Cuentas →</a>`;
        warn.querySelector('.goto-google').addEventListener('click', () => goView('accounts'));
        card.appendChild(warn);
      } else {
        toast(err.message, 'err');
      }
      btn.disabled = false;
    }
  }

  async function openBusinessPicker(type, btn) {
    const card = btn.closest('.product-card') || btn.closest('.auto-card');
    const activeForType = (cachedAutos && cachedAutos.active || []).filter(
      a => a.automation_type === type && a.status === 'active'
    );
    const activeBizIds = new Set(activeForType.map(a => a.business_id));

    const rows = cachedBusinesses.map(b => `
      <label style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px">
        <input type="checkbox" value="${escHtml(b.business_id)}" ${activeBizIds.has(b.business_id) ? 'checked disabled' : ''} />
        ${escHtml(b.business_name)}${activeBizIds.has(b.business_id) ? ' (ya activo)' : ''}

    picker.innerHTML = `

        <button class="btn sm ghost" type="button" data-cancel>Cancelar</button>

      </div>`;
    card.appendChild(picker);

    });
    picker.querySelector('[data-confirm]').addEventListener('click', async () => {
      const selected = [...picker.querySelectorAll('input[type=checkbox]:checked:not(:disabled)')].map(i => i.value);
      if (!selected.length) { toast('Selecciona al menos un negocio', 'err'); return; }
      try {
        const business_pairs = selected.map(bid => [type, bid]);
        const checkout = await api('POST', '/client/checkout/session', {
          automation_types: [type],
          billing_interval: 'monthly',
          business_pairs,
        });
        if (!checkout) return;
        if (checkout.checkout_url) {
          window.location.href = checkout.checkout_url;
          return;
        }
        if (checkout.mode === 'free') toast('Stripe no configurado — suscripción en modo demo', 'warn');
        for (const bid of selected) {
          await api('POST', withQuery(`/client/automations/${encodeURIComponent(type)}/activate`, bizQuery(bid)));
        }
        toast('Suscripción activada', 'ok');
        activeView = type;
        await loadWorkspace();
      } catch (err) {
        toast(err.message, 'err');
        picker.remove();
        btn.disabled = false;
      }
    });
  }

      }
      toast('Suscripción cancelada', 'ok');
      activeView = 'automations';
      await loadWorkspace();

      toast(err.message, 'err');
      if (trigger) trigger.disabled = false;

  function syncChrome() {
    const tab = effectiveSubtab();
    const pend = $('tab-pending');
    const hist = $('tab-history');
    if (pend) {
      const off = pendingReviewCount === 0;
      pend.classList.toggle('on', tab === 'pending');
      pend.classList.toggle('disabled', off);
      pend.disabled = off;
      if (off) pend.title = 'No hay propuestas pendientes';
      else pend.removeAttribute('title');
      let countEl = $('pending-tab-count');
      const text = badgeText(pendingReviewCount);
      if (!countEl && text) {
        countEl = document.createElement('span');
        countEl.className = 'tab-count';
        countEl.id = 'pending-tab-count';
        pend.appendChild(countEl);
      }
      if (countEl) {
        countEl.textContent = text;
        countEl.hidden = !text;
      }
    }
    if (hist) hist.classList.toggle('on', tab === 'history');
    document.querySelectorAll('[data-stars]').forEach(btn => {
      btn.classList.toggle('on', Number(btn.dataset.stars) === reviewStars);
    });
    const sel = $('star-select');
    if (sel && sel.value !== String(reviewStars)) sel.value = String(reviewStars);
    const sw = $('reply-mode-switch');
    if (sw && document.activeElement !== sw) sw.checked = replyMode === 'auto';
    const copy = modeCopy();
    const st = $('toggle-state');
    const hint = $('toggle-hint');
    const lead = $('reviews-lead');
    if (st) st.textContent = copy.state;
    if (hint) hint.textContent = copy.hint;
    if (lead) lead.textContent = reviewsLead();
  }

  function groupByDay(list) {
    const groups = [];
    list.forEach(d => {
      const label = dayLabel(d.created_at);
      const last = groups[groups.length - 1];
      if (!last || last.label !== label) groups.push({ label, items: [d] });
      else last.items.push(d);
    });
    return groups;
  }

  function reviewBody(text) {
    const raw = String(text || '').trim();
    if (!raw) return '<div class="review-text empty">(Sin texto — solo valoración)</div>';
    return `<div class="review-text">${escHtml(raw)}</div>`;
  }

  function historyBadge(status) {
    if (status === 'approved') return ['approved', 'Aprobada por ti'];
    if (status === 'edited') return ['edited', 'Editada por ti'];
    if (status === 'auto_sent') return ['auto', 'Automática'];
    if (status === 'rejected') return ['rejected', 'Rechazada'];
    if (status === 'failed') return ['rejected', 'Fallida'];
    return ['pending', statusLabel(status)];
  }

  function paintReviewList() {
    captureEdits();
    const host = $('review-list');
    if (!host) return;
    if (reviewLoadError) {
      host.innerHTML = `<div class="card"><div class="empty">${escHtml(reviewLoadError)}</div></div>`;
      return;
    }
    const tab = effectiveSubtab();
    const list = visibleDrafts(tab);
    if (!list.length) {
      const filtered = reviewQuery.trim() || reviewStars;
      const msg = tab === 'pending'
        ? (filtered ? 'Ninguna propuesta coincide con la búsqueda.' : 'No hay propuestas pendientes.')
        : (filtered ? 'Ninguna respuesta coincide con la búsqueda.' : 'Aún no hay historial de respuestas.');
      host.innerHTML = `<div class="card"><div class="empty">${escHtml(msg)}</div></div>`;
      return;
    }
    const showBulk = tab === 'pending' && replyMode !== 'auto';
    const bulk = showBulk ? `<div class="list-bar"><div class="list-bar-info"><strong>${list.length} propuesta${list.length === 1 ? '' : 's'} pendiente${list.length === 1 ? '' : 's'}</strong><span>Se publicarán en Google</span></div><button class="btn primary" type="button" id="btn-accept-all">${ICO.check}Aceptar todas (${list.length})</button></div>` : '';
    const groups = groupByDay(list).map(g => {
      const pairs = g.items.map(d => pairHtml(d, tab)).join('');
      return `<div class="day-sep">${escHtml(g.label)}</div>${pairs}`;
    }).join('');
    host.innerHTML = `${bulk}<div class="pair-list">${groups}</div>`;
    host.querySelectorAll('.pair').forEach(pair => {
      const id = pair.dataset.draftId;
      const approve = pair.querySelector('[data-action="approve"]');
      const reject = pair.querySelector('[data-action="reject"]');
      const edit = pair.querySelector('[data-action="edit"]');
      const more = pair.querySelector('[data-action="toggle-reply"]');
      if (approve) approve.addEventListener('click', () => resolveDraft(id, 'approve', pair));
      if (reject) reject.addEventListener('click', () => resolveDraft(id, 'reject', pair));
      if (edit) edit.addEventListener('click', () => {
        const ta = pair.querySelector('.draft-text');
        if (!ta) return;
        ta.focus();
        const end = ta.value.length;
        ta.setSelectionRange(end, end);
      });
      if (more) more.addEventListener('click', () => {
        expandedDrafts[id] = !expandedDrafts[id];
        paintReviewList();
      });
    });
    const acceptAll = $('btn-accept-all');
    if (acceptAll) acceptAll.addEventListener('click', () => acceptVisible());
  }

  function pairHtml(d, tab) {
    const name = d.reviewer_name || 'Anónimo';
    const stars = starsHtml(d.rating);
    const pending = tab === 'pending';
    let replyBlock = '';
    let actions = '';
    if (pending) {
      const value = Object.prototype.hasOwnProperty.call(draftEdits, d.draft_id) ? draftEdits[d.draft_id] : (d.suggested_reply || '');
      replyBlock = `<textarea class="draft-text" title="Puedes editar el texto" aria-label="Respuesta sugerida">${escHtml(value)}</textarea>`;
      actions = `<div class="proposal-actions"><button class="btn primary" type="button" data-action="approve">${ICO.check}Aprobar y publicar</button><div class="actions-spacer"></div><button class="btn-link" type="button" data-action="edit">Editar</button><button class="btn-link danger" type="button" data-action="reject">Rechazar</button></div>`;
    } else {
      const full = String(d.final_reply || d.suggested_reply || '');
      const open = !!expandedDrafts[d.draft_id];
      const clipped = !open && full.length > 160;
      const shown = clipped ? full.slice(0, 160).trimEnd() + '…' : full;
      replyBlock = `<div class="reply-published">${escHtml(shown || '—')}</div>`;
      if (full.length > 160) {
        actions = `<div class="proposal-actions"><div class="actions-spacer"></div><button class="btn-link" type="button" data-action="toggle-reply">${open ? 'Ocultar' : 'Ver'}</button></div>`;
      }
    }
    const badge = pending ? ['pending', 'Pendiente'] : historyBadge(d.status);
    const col = pending ? 'Respuesta de ZeroManual' : 'Respuesta';
    return `<div class="pair" data-draft-id="${escHtml(d.draft_id)}">
      <article class="block">
        <div class="col-label">${ICO.bubble}Reseña original</div>
        <div class="reviewer"><div class="reviewer-av">${escHtml(initials(name))}</div><div><div class="reviewer-name">${escHtml(name)}</div>${stars ? `<div class="stars">${stars}</div>` : ''}</div></div>
        ${reviewBody(d.source_text)}
      </article>
      <div class="connector" aria-hidden="true">${ICO.arrow}</div>
      <article class="block proposal">
        <div class="proposal-head"><div class="col-label">${ICO.bot}${col}</div><span class="tag ${badge[0]}">${escHtml(badge[1])}</span></div>
        ${replyBlock}
        ${actions}
      </article>
    </div>`;
  }

  async function resolveDraft(draftId, action, cardEl) {
    const buttons = cardEl.querySelectorAll('button');
    buttons.forEach(b => { b.disabled = true; });
    try {
      if (action === 'approve') {
        const text = cardEl.querySelector('.draft-text').value;
        draftEdits[draftId] = text;
        const res = await api('POST', `/client/drafts/${encodeURIComponent(draftId)}/approve`, { final_reply: text });
        if (!res) return;
        delete draftEdits[draftId];
        toast('Respuesta publicada en Google', 'ok');
      } else {
        const res = await api('POST', `/client/drafts/${encodeURIComponent(draftId)}/reject`);
        if (!res) return;
        toast('Respuesta rechazada');
      }
      await loadWorkspace();
    } catch (e) {
      toast(e.message, 'err');
      buttons.forEach(b => { b.disabled = false; });
      if (/no se pudo publicar/i.test(e.message || '')) await loadWorkspace();
    }
  }

  async function approveMany(list) {
    let ok = 0;
    const errors = [];
    for (const d of list) {
      const text = replyTextFor(d);
      draftEdits[d.draft_id] = text;
      try {
        const res = await api('POST', `/client/drafts/${encodeURIComponent(d.draft_id)}/approve`, { final_reply: text });
        if (!res) return { ok, errors, aborted: true };
        ok += 1;
        delete draftEdits[d.draft_id];
      } catch (err) {
        errors.push(err.message || 'Error');
      }
    }
    return { ok, errors, aborted: false };
  }

  function reportApproveResult(result, total) {
    if (!result || result.aborted) return;
    if (!result.errors.length) {
      toast(total === 1 ? 'Respuesta publicada en Google' : `${result.ok} respuestas publicadas en Google`, 'ok');
      return;
    }
    if (!result.ok) {
      toast(result.errors[0] || 'No se pudo publicar', 'err');
      return;
    }
    toast(`Publicadas ${result.ok} de ${total}. ${result.errors.length} no se pudieron publicar.`, 'err');
  }

  async function acceptVisible() {
    captureEdits();
    const list = visibleDrafts('pending');
    if (!list.length || replyMode === 'auto') return;
    const btn = $('btn-accept-all');
    if (btn) { btn.disabled = true; btn.textContent = 'Publicando…'; }
    const result = await approveMany(list);
    reportApproveResult(result, list.length);
    if (!result.aborted) await loadWorkspace();
  }

  function closeAutoModal() {
    const el = $('auto-modal');
    if (el) el.remove();
    document.removeEventListener('keydown', onAutoModalKey);
  }

  function onAutoModalKey(e) {
    if (e.key === 'Escape') closeAutoModal();
  }

  function openAutoModal() {
    captureEdits();
    closeAutoModal();
    const n = pendingDrafts().length;
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.id = 'auto-modal';
    const check = n > 0
      ? `<label class="modal-check"><input type="checkbox" id="auto-publish-pending"/><span>¿Publicar también ${n === 1 ? 'la <strong>1 propuesta pendiente</strong>' : `las <strong>${n} propuestas pendientes</strong>`}?</span></label>`
      : '';
    backdrop.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="auto-modal-title">
      <div class="modal-icon">${ICO.alert}</div>
      <h2 id="auto-modal-title">¿Activar respuestas automáticas?</h2>
      <p>ZeroManual publicará en Google sin tu revisión. Podrás desactivarlo cuando quieras; pausar o cancelar la suscripción está en Gestionar suscripción.</p>
      ${check}
      <div class="modal-actions">
        <button class="btn ghost" type="button" id="auto-cancel">Cancelar</button>
        <button class="btn primary" type="button" id="auto-confirm">Activar</button>
      </div>
    </div>`;
    document.body.appendChild(backdrop);
    const box = $('auto-publish-pending');
    const confirmBtn = $('auto-confirm');
    function syncBtn() {
      if (box && box.checked) confirmBtn.textContent = `Activar y publicar pendientes (${n})`;
      else confirmBtn.textContent = 'Activar';
    }
    if (box) box.addEventListener('change', syncBtn);
    syncBtn();
    $('auto-cancel').addEventListener('click', closeAutoModal);
    backdrop.addEventListener('click', e => { if (e.target === backdrop) closeAutoModal(); });
    document.addEventListener('keydown', onAutoModalKey);
    confirmBtn.addEventListener('click', async () => {
      const publish = !!(box && box.checked);
      confirmBtn.disabled = true;
      $('auto-cancel').disabled = true;
      confirmBtn.textContent = 'Activando…';
      const ok = await setReplyMode('auto');
      if (!ok) {
        confirmBtn.disabled = false;
        $('auto-cancel').disabled = false;
        syncBtn();
        return;
      }
      closeAutoModal();
      if (publish) {
        const list = pendingDrafts();
        const result = await approveMany(list);
        reportApproveResult(result, list.length);
      } else {
        toast('Respuestas automáticas activadas', 'ok');
      }
      await loadWorkspace();
    });
    $('auto-cancel').focus();
  }

  async function setReplyMode(next) {
    if (modeBusy) return false;
    modeBusy = true;
    try {
      const res = await api('PUT', withQuery('/client/automations/google_reviews/settings', bizQuery(activeBusinessId)), { reply_mode: next });
      if (!res) return false;
      replyMode = res.reply_mode || next;
      syncChrome();
      paintReviewList();
      return true;
    } catch (e) {
      toast(e.message, 'err');
      const sw = $('reply-mode-switch');
      if (sw) sw.checked = replyMode === 'auto';
      return false;
    } finally {
      modeBusy = false;
    }
  }

  function onReplySwitch(e) {
    const input = e.currentTarget;
    if (input.checked) {
      input.checked = false;
      openAutoModal();
      return;
    }
    setReplyMode('approval').then(ok => {
      if (ok) toast('Respuestas automáticas desactivadas', 'ok');
    });
  }

  const GSVG = `<svg class="google-box-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5a4.7 4.7 0 0 1-2 3.1v2.6h3.3c1.9-1.8 3-4.4 3-7.5z" fill="#4285F4"/>
    <path d="M12 22c2.7 0 5-.9 6.7-2.4l-3.3-2.6c-.9.6-2.1 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3v2.6A10 10 0 0 0 12 22z" fill="#34A853"/>
    <path d="M6.4 13.9A6 6 0 0 1 6.1 12c0-.7.1-1.3.3-1.9V7.5H3A10 10 0 0 0 2 12c0 1.6.4 3.1 1 4.5l3.4-2.6z" fill="#FBBC05"/>
    <path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 12 2 10 10 0 0 0 3 7.5l3.4 2.6C7.2 7.7 9.4 5.9 12 5.9z" fill="#EA4335"/>
  </svg>`;

  const IGSVG = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs><linearGradient id="igBrand" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#F58529"/><stop offset="30%" stop-color="#DD2A7B"/><stop offset="60%" stop-color="#8134AF"/><stop offset="100%" stop-color="#515BD4"/></linearGradient></defs>
    <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="url(#igBrand)" stroke-width="1.8"/>
    <circle cx="12" cy="12" r="4.2" fill="none" stroke="url(#igBrand)" stroke-width="1.8"/>
    <circle cx="17.2" cy="6.8" r="1.1" fill="#DD2A7B"/>
  </svg>`;

  const TTSVG = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path fill="#25F4EE" d="M16.6 5.82A4.23 4.23 0 0 1 15.24 3h-3.18v12.4a2.58 2.58 0 1 1-2.58-2.6c.2 0 .4.02.58.06v-3.23a5.76 5.76 0 0 0-.58-.03A5.8 5.8 0 1 0 14.7 15.4V9.15a7.4 7.4 0 0 0 4.28 1.35V7.3a4.24 4.24 0 0 1-2.38-1.48z"/>
    <path fill="#FE2C55" d="M15.5 6.3A4.23 4.23 0 0 1 14.14 3.5h-2.1v12.4a2.58 2.58 0 1 1-2.58-2.6c.2 0 .4.02.58.06V10.1a5.8 5.8 0 1 0 4.2 5.55V9.15a7.4 7.4 0 0 0 4.28 1.35V7.3a4.24 4.24 0 0 1-3.02-1z" opacity=".9"/>
    <path fill="#111" d="M15.7 5.5A4.23 4.23 0 0 1 14.34 2.7H11.2v12.4a2.58 2.58 0 1 1-2.58-2.6c.2 0 .4.02.58.06V9.33a5.76 5.76 0 0 0-.58-.03A5.8 5.8 0 1 0 13.8 15V8.85a7.4 7.4 0 0 0 4.28 1.35V6.98a4.24 4.24 0 0 1-2.38-1.48z"/>
  </svg>`;

  const ACCOUNT_ICONS = {
    google: GSVG,
    instagram: IGSVG,
    tiktok: TTSVG,
  };

  const ACCOUNT_COPY = {
    google: { title: 'Google', idle: 'Business Profile' },
    instagram: { title: 'Instagram', idle: 'Necesario para automatizaciones de redes' },
    tiktok: { title: 'TikTok', idle: 'Necesario para automatizaciones de redes' },
  };

  async function connectGoogle() {
    try {
      const r = await api('GET', '/client/google/connect');
      if (r && r.redirect_url) window.location.href = r.redirect_url;
    } catch (e) { toast(e.message, 'err'); }
  }

  async function disconnectGoogle() {
    if (!confirm('¿Desconectar Google Business? Las automatizaciones que lo usen dejarán de funcionar hasta que vuelvas a conectar.')) return;
    try {
      await api('DELETE', '/client/google/disconnect');
      toast('Google desconectado', 'ok');
      await loadWorkspace();
    } catch (e) { toast(e.message, 'err'); }
  }

  async function renderAccounts(c) {
    try {
      const data = await api('GET', '/client/accounts/status');
      if (!data) return;
      const accounts = (data.accounts || []).filter(acc => ACCOUNT_COPY[acc.provider]);
      c.innerHTML = pageChrome('Cuentas', 'Conecta las plataformas que usan tus automatizaciones.') + '<div class="page-body"><div class="acct-list" id="accounts-list"></div></div>';
      const list = $('accounts-list');
      accounts.forEach(acc => {
        const copy = ACCOUNT_COPY[acc.provider];
        const icon = ACCOUNT_ICONS[acc.provider] || '';
        const div = document.createElement('div');
        div.className = 'acct-row';
        let detail = copy.idle;
        if (acc.provider === 'google' && acc.connected) {
          detail = `Business Profile · ${acc.account_label || 'conectada'}`;
        }
        let side = '';
        if (acc.connected) {
          side = `<div class="acct-side"><span class="pill ok">Conectado</span>${acc.provider === 'google' ? '<button class="btn-link" type="button" data-disconnect="google">Desconectar</button>' : ''}</div>`;
        } else if (acc.connectable && acc.provider === 'google') {
          side = `<button class="btn ghost" type="button" data-connect="google">Conectar</button>`;
        } else {
          side = `<button class="btn ghost" type="button" data-soon="${escHtml(acc.provider)}">Conectar</button>`;
        }
        div.innerHTML = `
          <div class="acct-logo">${icon}</div>
          <div class="acct-info"><strong>${escHtml(copy.title)}</strong><span>${escHtml(detail)}</span></div>
          ${side}`;
        const connectBtn = div.querySelector('[data-connect="google"]');
        if (connectBtn) connectBtn.addEventListener('click', connectGoogle);
        const soonBtn = div.querySelector('[data-soon]');
        if (soonBtn) soonBtn.addEventListener('click', () => toast('Conexión disponible próximamente', 'ok'));
        const discBtn = div.querySelector('[data-disconnect]');
        if (discBtn) discBtn.addEventListener('click', disconnectGoogle);
        list.appendChild(div);
      });
    } catch (e) {
      c.innerHTML = pageChrome('Cuentas', '') + '<div class="page-body"><div class="card"><div class="empty">Error cargando cuentas. Recarga la página.</div></div></div>';
    }
  }

  function showLogin() {
    $('view-login').style.display = '';
    $('view-register').style.display = 'none';
    $('inp-email').focus();
  }
  function showRegister() {
    $('view-login').style.display = 'none';
    $('view-register').style.display = '';
    $('reg-name').focus();
  }

  async function tryRegister() {
    const name = $('reg-name').value.trim();
    const email = $('reg-email').value.trim();
    const password = $('reg-password').value;
    $('register-error').textContent = '';
    if (!name || !email || !password) { $('register-error').textContent = 'Completa todos los campos.'; return; }
    if (password.length < 8) { $('register-error').textContent = 'La contraseña debe tener al menos 8 caracteres.'; return; }
    const btn = $('btn-register');
    btn.disabled = true; btn.textContent = 'Creando cuenta…';
    try {
      const r = await fetch('/client/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || 'Error al registrar');
      token = data.token;
      currentClient = data.client;
      localStorage.setItem(TOKEN_KEY, token);
      showApp();
    } catch (e) {
      $('register-error').textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = 'Crear cuenta →';
    }
  }

  document.addEventListener('visibilitychange', onReviewSurfaceResume);
  window.addEventListener('focus', onReviewSurfaceResume);

  document.addEventListener('click', (e) => {
    const menu = $('avatar-menu');
    const chip = $('user-chip');
    if (menuOpen && menu && chip && !menu.contains(e.target) && !chip.contains(e.target)) {
      menuOpen = false;
      renderNav();
    }
    const sub = $('sub-menu');
    const manage = $('sub-manage');
    if (sub && !sub.hidden && manage && !manage.contains(e.target)) {
      sub.hidden = true;
      const more = $('btn-more-sub');
      if (more) more.setAttribute('aria-expanded', 'false');
    }
  });

  $('btn-login').addEventListener('click', tryLogin);
  $('inp-password').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  $('btn-register').addEventListener('click', tryRegister);
  $('reg-password').addEventListener('keydown', e => { if (e.key === 'Enter') tryRegister(); });
  $('link-register').addEventListener('click', showRegister);
  $('link-login').addEventListener('click', showLogin);

  (async () => {
    const params = new URLSearchParams(window.location.search);
    const activatedType = params.get('activated');
    if (activatedType) {
      const lbl = AUTOMATION_LABELS[activatedType] || { name: activatedType };
      toast(`Automatización activada ✓ — ${lbl.name}`, 'ok');
      activeView = activatedType;
      if (activatedType === 'google_reviews') reviewsActivatedAt = Date.now();
    } else if (params.get('checkout') === 'paid') {
      toast('Pago recibido. Completa la conexión de Google para activar.', 'ok');
    } else if (params.get('connected') === '1') {
      toast('Google Business conectado correctamente', 'ok');
      activeView = 'accounts';
    }
    if (params.get('checkout') === 'error') toast('No se pudo confirmar el pago. Inténtalo de nuevo.', 'err');
    if (params.get('error') === 'oauth_failed') toast('Error al conectar Google. Inténtalo de nuevo.', 'err');

    if (params.get('connect') === 'google' && localStorage.getItem('mz_client_token')) {
      try {
        const r = await fetch('/client/google/connect', {
          headers: { Authorization: 'Bearer ' + localStorage.getItem('mz_client_token') },
        });
        if (r.ok) {
          const d = await r.json();
          if (d.redirect_url) { window.location.href = d.redirect_url; return; }
        }
      } catch (err) { /* se queda en el portal */ }
    }

    const ok = await tryRestoreSession();
    if (ok) showApp();
    else { $('login-overlay').classList.remove('hidden'); $('inp-email').focus(); }
  })();
})();
</script>
</body>
</html>
