<!DOCTYPE html>
<html lang="es" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroManual · Admin web</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='none' stroke='%231b2030' stroke-width='2'/><circle cx='16' cy='16' r='8' fill='%234f56c9'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f6f7fa; --bg-2: #f1f3f7; --bg-3: #e9edf3;
      --line: #e2e5ec; --line-2: #c8cdd9;
      --fg: #1b2030; --fg-2: #3b4a6b; --fg-3: #6b7280;
      --accent: #4f56c9; --accent-h: #4349b0; --accent-soft: #ecedfb; --accent-fg: #fff;
      --ok: #047857; --err: #e5484d;
      --r: 14px; --r-sm: 10px;
      --shadow: 0 20px 50px -28px rgba(27,32,48,0.18), 0 2px 6px -2px rgba(27,32,48,0.06);
      --shadow-sm: 0 1px 2px rgba(27,32,48,0.04), 0 8px 24px rgba(27,32,48,0.06);
      --grid: rgba(27,32,48,0.04);
      --font: "Plus Jakarta Sans", system-ui, sans-serif;
      --display: "Space Grotesk", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --serif: "Instrument Serif", "Times New Roman", serif;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--fg);
      font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--accent); color: var(--accent-fg); }
    .login-brand-name, .topbar-brand-name, .login-title, .card-title, .modal-title, .page-heading {
      font-family: var(--display);
    }
    #login-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center; background: var(--bg);
      transition: opacity .25s ease;
    }
    #login-overlay::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 55% at 50% 40%, #000 25%, transparent 75%);
    }
    #login-overlay::after {
      content: ""; position: absolute; width: 280px; height: 280px; border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--accent) 28%, transparent), transparent 70%);
      bottom: 10%; right: 14%; pointer-events: none;
    }
    #login-overlay.hidden { opacity: 0; pointer-events: none; }
    .login-card {
      position: relative; z-index: 1; width: min(380px, calc(100vw - 32px));
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      box-shadow: var(--shadow); padding: 40px 36px;
      animation: zmPop .35s cubic-bezier(.2,.7,.3,1);
    }
    @keyframes zmPop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
    .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .login-brand-mark, .topbar-brand-mark {
      border: 1.5px solid var(--fg); border-radius: 50%; position: relative;
      display: inline-block; flex-shrink: 0;
    }
    .login-brand-mark { width: 28px; height: 28px; }
    .login-brand-mark::after, .topbar-brand-mark::after {
      content: ""; position: absolute; inset: 5px; background: var(--accent);
      border-radius: 50%; animation: pulse 2.4s ease-in-out infinite;
    }
    .topbar-brand-mark { width: 22px; height: 22px; }
    .topbar-brand-mark::after { inset: 4px; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.55); opacity: 0.7; } }
    .login-brand-name { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
    .login-brand-name span, .topbar-brand-name span { font-weight: 300; }
    .login-title { font-size: 22px; font-weight: 500; letter-spacing: -.02em; margin-bottom: 6px; }
    .login-sub { color: var(--fg-3); margin-bottom: 24px; font-size: 13.5px; line-height: 1.45; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 500; color: var(--fg-2);
      margin-bottom: 5px; font-family: var(--display);
    }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line);
      border-radius: 8px; font: inherit; font-size: 14px; color: var(--fg); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px;
      border-radius: 8px; border: 1px solid transparent; font: inherit;
      font-family: var(--display); font-size: 13.5px; font-weight: 500; letter-spacing: -.01em;
      cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: background .15s, border-color .15s, color .15s, transform .15s, filter .15s;
    }
    .btn .arrow { display: inline-block; transition: transform .2s; }
    .btn:hover .arrow { transform: translateX(2px); }
    .btn.primary { background: var(--accent); color: var(--accent-fg); }
    .btn.primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn.ghost { background: transparent; border-color: var(--line-2); color: var(--fg-2); }
    .btn.ghost:hover { background: var(--bg-3); border-color: var(--fg-2); color: var(--fg); }
    .btn.danger { background: transparent; border-color: var(--err); color: var(--err); }
    .btn.danger:hover { background: var(--err); color: #fff; }
    .btn.sm { padding: 5px 10px; font-size: 12px; }
    .btn.full { width: 100%; justify-content: center; margin-top: 8px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; filter: none; }
    .error-msg { color: var(--err); font-size: 12px; margin-top: 8px; min-height: 16px; }
    #app { display: flex; flex-direction: column; height: 100%; }
    .topbar {
      position: sticky; top: 0; z-index: 40; height: 64px; flex-shrink: 0;
      display: flex; align-items: center; padding: 0 24px; gap: 16px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-brand {
      display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg);
    }
    .topbar-brand-name { font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
    .topbar-divider { width: 1px; height: 18px; background: var(--line); }
    .topbar-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px 4px 8px; border: 1px solid var(--line); border-radius: 100px;
      background: color-mix(in srgb, var(--bg-2) 80%, white 20%);
      font-family: var(--display); font-size: 12px; font-weight: 500; color: var(--fg-2);
    }
    .topbar-pill .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .topbar-spacer { flex: 1; }
    .topbar-user { font-size: 12.5px; color: var(--fg-3); }
    .topbar-user strong { color: var(--fg-2); font-weight: 600; }
    .shell { flex: 1; display: flex; min-height: 0; }
    .sidebar {
      width: 260px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; }
    .sidebar-brand-mark {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      background: var(--accent-soft); color: var(--accent);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .sidebar-brand-mark svg { width: 18px; height: 18px; }
    .sidebar-brand-title {
      font-family: var(--display); font-size: 13.5px; font-weight: 600; letter-spacing: -.01em;
    }
    .sidebar-brand-sub { font-size: 11.5px; color: var(--fg-3); margin-top: 1px; }
    .sidebar-section { padding: 8px 12px; }
    .sidebar-label {
      font-family: var(--display); font-size: 11px; font-weight: 500;
      letter-spacing: .04em; text-transform: uppercase; color: var(--fg-3);
      padding: 0 8px 8px;
    }
    .tab {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 10px; border: none; background: transparent; border-radius: 10px;
      cursor: pointer; font: inherit; font-size: 13px; color: var(--fg-2);
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .tab:hover { background: var(--bg-2); color: var(--fg); }
    .tab.on {
      background: var(--accent-soft); color: var(--accent); font-weight: 600;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .tab-ico {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--bg-2); color: var(--fg-3);
    }
    .tab-ico svg { width: 16px; height: 16px; }
    .tab.on .tab-ico { background: color-mix(in srgb, var(--accent) 16%, #fff); color: var(--accent); }
    .sidebar-foot {
      margin-top: auto; padding: 14px 16px; border-top: 1px solid var(--line);
      font-size: 11.5px; color: var(--fg-3); line-height: 1.45;
    }
    .sidebar-foot em { font-family: var(--serif); font-style: italic; color: var(--fg-2); }
    .content {
      flex: 1; overflow-y: auto; padding: 28px 28px 40px;
      background:
        radial-gradient(ellipse 50% 30% at 90% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%),
        var(--bg);
    }
    .page-heading { font-size: 22px; font-weight: 500; letter-spacing: -.02em; margin-bottom: 4px; }
    .page-lede { color: var(--fg-3); font-size: 13.5px; margin-bottom: 18px; }
    .card {
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      padding: 22px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
    .card-title { font-size: 15px; font-weight: 500; letter-spacing: -.01em; }
    .card-sub { font-size: 12.5px; color: var(--fg-3); margin-top: 3px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th {
      text-align: left; font-size: 11px; font-weight: 500; letter-spacing: .04em;
      text-transform: uppercase; color: var(--fg-3); padding: 0 10px 10px;
      border-bottom: 1px solid var(--line); font-family: var(--display);
    }
    .tbl td { padding: 12px 10px; border-bottom: 1px solid var(--bg-2); vertical-align: middle; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tr:hover td { background: color-mix(in srgb, var(--accent) 3%, transparent); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 100px;
      font-size: 11px; font-weight: 500; background: var(--bg-2); color: var(--fg-3);
      font-family: var(--display);
    }
    .empty { text-align: center; padding: 48px 16px; color: var(--fg-3); font-size: 13.5px; }
    .loading { text-align: center; padding: 32px; color: var(--fg-3); font-size: 13px; }
    #toast {
      position: fixed; bottom: 24px; right: 24px; background: var(--fg); color: var(--bg);
      border-radius: 10px; padding: 11px 16px; font-size: 13px; font-weight: 500;
      font-family: var(--display); box-shadow: var(--shadow);
      transform: translateY(16px); opacity: 0; transition: transform .2s, opacity .2s;
      pointer-events: none; z-index: 200;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.ok { background: var(--ok); }
    #toast.err { background: var(--err); }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(27,32,48,.35);
      display: flex; align-items: center; justify-content: center; z-index: 150;
      backdrop-filter: blur(4px);
    }
    .modal-bg.hidden { display: none; }
    .modal {
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      padding: 28px 24px; width: min(380px, calc(100vw - 32px)); box-shadow: var(--shadow);
      animation: zmPop .28s cubic-bezier(.2,.7,.3,1);
    }
    .modal-title { font-size: 16px; font-weight: 500; letter-spacing: -.01em; margin-bottom: 18px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .hint {
      margin-bottom: 16px; padding: 12px 14px; background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 18%, var(--line));
      border-radius: 10px; font-size: 12.5px; color: var(--fg-2); line-height: 1.45;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
    @media (max-width: 720px) {
      .topbar { padding: 0 14px; height: 56px; }
      .topbar-pill { display: none; }
      .shell { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--line); }
      .content { padding: 18px 14px 32px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

<div id="login-overlay">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-mark"></div>
      <div class="login-brand-name">Zero<span>Manual</span></div>
    </div>
    <div class="login-title">Admin web</div>
    <div class="login-sub">Usuarios y clientes del portal. Facturación y agentes están en OpsCenter.</div>
    <div class="form-group">
      <label for="inp-username">Usuario</label>
      <input id="inp-username" type="text" autocomplete="username" placeholder="admin" />
    </div>
    <div class="form-group">
      <label for="inp-password">Contraseña</label>
      <input id="inp-password" type="password" autocomplete="current-password" placeholder="••••••••" />
    </div>
    <div class="error-msg" id="login-error"></div>
    <button class="btn primary full" id="btn-login">Entrar <span class="arrow">→</span></button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <a class="topbar-brand" href="/" aria-label="ZeroManual inicio">
      <div class="topbar-brand-mark" aria-hidden="true"></div>
      <div class="topbar-brand-name">Zero<span>Manual</span></div>
    </a>
    <div class="topbar-divider" aria-hidden="true"></div>
    <div class="topbar-pill"><span class="dot" aria-hidden="true"></span> Admin web</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-user">Sesión: <strong id="lbl-user">—</strong></div>
    <button class="btn ghost sm" id="btn-logout">Salir</button>
  </div>
  <div class="shell">
    <aside class="sidebar" aria-label="Navegación admin">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5"/><path d="M12 12v9"/><path d="M12 12L4 7.5"/></svg>
        </div>
        <div>
          <div class="sidebar-brand-title">Gestión web</div>
          <div class="sidebar-brand-sub">Clientes y accesos</div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Menú</div>
        <button class="tab on" data-tab="clients" type="button">
          <span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.2"/><path d="M22 21v-2a3.5 3.5 0 0 0-2.5-3.3"/><path d="M16.5 3.8a3.2 3.2 0 0 1 0 6.3"/></svg></span>
          <span>Clientes</span>
        </button>
        <button class="tab" data-tab="users" type="button">
          <span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v5c0 4.2-2.9 7.9-7 9-4.1-1.1-7-4.8-7-9V7l7-4z"/><path d="M9.5 12.2l1.7 1.7 3.5-3.8"/></svg></span>
          <span>Usuarios admin</span>
        </button>
      </div>
      <div class="sidebar-foot">
        Facturación y agentes viven en <em>OpsCenter</em>. Aquí solo el portal web.
      </div>
    </aside>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-bg hidden" id="modal-user">
  <div class="modal">
    <div class="modal-title">Nuevo usuario admin</div>
    <div class="form-group">
      <label>Usuario</label>
      <input id="new-username" type="text" placeholder="nombre" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input id="new-email" type="email" placeholder="correo@ejemplo.com" />
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input id="new-password" type="password" placeholder="••••••••" />
    </div>
    <div class="form-group">
      <label>Rol</label>
      <select id="new-role">
        <option value="admin">admin</option>
        <option value="viewer">viewer</option>
      </select>
    </div>
    <div class="error-msg" id="new-user-error"></div>
    <div class="modal-footer">
      <button class="btn ghost" id="modal-cancel">Cancelar</button>
      <button class="btn primary" id="modal-confirm">Crear usuario</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  let token = sessionStorage.getItem('mz_token') || null;
  let currentUser = null;
  let activeTab = 'clients';

  const $ = id => document.getElementById(id);
  let toastTimer = null;
  function toast(msg, kind = '') {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'show' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 2800);
  }

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
  }

  async function api(method, path, body) {
    const opts = { method, headers: authHeaders() };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch(path, opts);
    if (r.status === 401) { doLogout(); return null; }
    if (!r.ok) {
      const t = await r.text();
      let detail = t;
      try { detail = JSON.parse(t).detail || t; } catch {}
      throw new Error(detail);
    }
    return r.json();
  }

  function escHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function dateStr(v) {
    if (!v) return '—';
    try { return new Date(v).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' }); }
    catch { return String(v); }
  }

  async function doLogin() {
    const username = $('inp-username').value.trim();
    const password = $('inp-password').value;
    if (!username || !password) { $('login-error').textContent = 'Completa usuario y contraseña.'; return; }
    $('login-error').textContent = '';
    const btn = $('btn-login');
    btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      const r = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || 'Error de login');
      token = data.token;
      sessionStorage.setItem('mz_token', token);
      currentUser = data.user;
      showApp();
    } catch (e) {
      $('login-error').textContent = e.message;
    } finally {
      btn.disabled = false; btn.innerHTML = 'Entrar <span class="arrow">→</span>';
    }
  }

  function doLogout() {
    if (token) fetch('/auth/logout', { method: 'POST', headers: authHeaders() }).catch(() => {});
    token = null; currentUser = null;
    sessionStorage.removeItem('mz_token');
    $('login-overlay').classList.remove('hidden');
  }

  async function restoreSession() {
    if (!token) return;
    try {
      const data = await api('GET', '/auth/me');
      if (!data) return;
      currentUser = data.user;
      showApp();
    } catch {
      doLogout();
    }
  }

  function showApp() {
    $('login-overlay').classList.add('hidden');
    $('lbl-user').textContent = currentUser ? currentUser.username : '—';
    loadTab(activeTab);
  }

  function loadTab(name) {
    activeTab = name;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === name));
    const c = $('content');
    c.innerHTML = '<div class="loading">Cargando…</div>';
    if (name === 'users') tabUsers(c);
    else tabClients(c);
  }

  async function tabUsers(c) {
    try {
      const data = await api('GET', '/api/v1/admin/users');
      if (!data) return;
      const users = data.users || [];
      c.innerHTML = `<div class="page-heading">Usuarios admin</div>
        <div class="page-lede">Accesos a este panel de gestión web (no es OpsCenter).</div>
        <div class="hint">Solo cuentas internas. La facturación y los agentes se gestionan en OpsCenter.</div>
        <div class="card">
        <div class="card-head">
          <div><div class="card-title">Directorio</div><div class="card-sub">${users.length} usuario(s)</div></div>
          <button class="btn primary sm" id="btn-new-user">+ Nuevo usuario</button>
        </div>
        ${users.length ? `<table class="tbl">
          <thead><tr><th>Usuario</th><th>Email</th><th>Rol</th><th>Creado</th><th></th></tr></thead>
          <tbody id="users-tbody">${users.map(u => userRow(u)).join('')}</tbody>
        </table>` : '<div class="empty">No hay usuarios.</div>'}
      </div>`;
      $('btn-new-user').onclick = openNewUserModal;
      bindDeleteButtons();
    } catch (e) {
      c.innerHTML = `<div class="card"><div class="empty">${escHtml(e.message)}</div></div>`;
    }
  }

  function userRow(u) {
    const isSelf = currentUser && u.user_id === currentUser.user_id;
    return `<tr id="ur-${u.user_id}">
      <td><strong>${escHtml(u.username)}</strong></td>
      <td>${escHtml(u.email || '—')}</td>
      <td><span class="badge">${escHtml(u.role || '—')}</span></td>
      <td>${dateStr(u.created_at)}</td>
      <td>${isSelf ? '' : `<button class="btn danger sm del-user-btn" data-id="${u.user_id}" data-name="${escHtml(u.username)}">Eliminar</button>`}</td>
    </tr>`;
  }

  function bindDeleteButtons() {
    document.querySelectorAll('.del-user-btn').forEach(btn => {
      btn.onclick = () => doDeleteUser(btn.dataset.id, btn.dataset.name);
    });
  }

  function openNewUserModal() {
    $('new-username').value = '';
    $('new-email').value = '';
    $('new-password').value = '';
    $('new-role').value = 'admin';
    $('new-user-error').textContent = '';
    $('modal-user').classList.remove('hidden');
    $('new-username').focus();
  }

  async function doCreateUser() {
    const username = $('new-username').value.trim();
    const email = $('new-email').value.trim();
    const password = $('new-password').value;
    const role = $('new-role').value;
    $('new-user-error').textContent = '';
    if (!username || !password) { $('new-user-error').textContent = 'Usuario y contraseña son obligatorios.'; return; }
    const btn = $('modal-confirm');
    btn.disabled = true; btn.textContent = 'Creando…';
    try {
      const data = await api('POST', '/api/v1/admin/users', { username, email, password, role });
      if (!data) return;
      $('modal-user').classList.add('hidden');
      toast('Usuario creado', 'ok');
      loadTab('users');
    } catch (e) { $('new-user-error').textContent = e.message; }
    finally { btn.disabled = false; btn.textContent = 'Crear usuario'; }
  }

  async function doDeleteUser(userId, username) {
    if (!confirm(`¿Eliminar al usuario "${username}"?`)) return;
    try {
      await api('DELETE', `/api/v1/admin/users/${userId}`);
      toast('Usuario eliminado');
      $(`ur-${userId}`)?.remove();
    } catch (e) { toast(e.message, 'err'); }
  }

  async function tabClients(c) {
    try {
      const data = await api('GET', '/api/v1/admin/clients');
      if (!data) return;
      const clients = data.clients || [];
      c.innerHTML = `<div class="page-heading">Clientes del portal</div>
        <div class="page-lede">Altas y bajas de cuentas en /client. Facturación y agentes: OpsCenter.</div>
        <div class="hint">Gestiona el acceso al portal de cliente. Las operaciones de negocio se hacen en OpsCenter.</div>
        <div class="card">
        <div class="card-head">
          <div><div class="card-title">Directorio</div><div class="card-sub">${clients.length} cliente(s)</div></div>
          <button class="btn primary sm" id="btn-new-client">+ Nuevo cliente</button>
        </div>
        ${clients.length ? `<table class="tbl">
          <thead><tr><th>Negocio</th><th>Email</th><th>Plan</th><th>Creado</th><th></th></tr></thead>
          <tbody id="clients-tbody">${clients.map(cl => clientRow(cl)).join('')}</tbody>
        </table>` : '<div class="empty">No hay clientes todavía. Crea el primero.</div>'}
      </div>`;
      $('btn-new-client').onclick = openNewClientModal;
      bindClientDeleteButtons();
    } catch (e) {
      c.innerHTML = `<div class="card"><div class="empty">${escHtml(e.message)}</div></div>`;
    }
  }

  function clientRow(cl) {
    return `<tr id="cr-${cl.client_id}">
      <td><strong>${escHtml(cl.name)}</strong></td>
      <td>${escHtml(cl.email)}</td>
      <td><span class="badge">${escHtml(cl.plan || 'starter')}</span></td>
      <td>${dateStr(cl.created_at)}</td>
      <td><button class="btn danger sm del-client-btn" data-id="${cl.client_id}" data-name="${escHtml(cl.name)}">Eliminar</button></td>
    </tr>`;
  }

  function bindClientDeleteButtons() {
    document.querySelectorAll('.del-client-btn').forEach(btn => {
      btn.onclick = () => doDeleteClient(btn.dataset.id, btn.dataset.name);
    });
  }

  let _newClientModal = null;
  function openNewClientModal() {
    if (!_newClientModal) {
      const div = document.createElement('div');
      div.className = 'modal-bg';
      div.id = 'modal-client';
      div.innerHTML = `<div class="modal">
        <div class="modal-title">Nuevo cliente</div>
        <div class="form-group"><label>Nombre del negocio</label><input id="nc-name" type="text" placeholder="Café Luma" /></div>
        <div class="form-group"><label>Email</label><input id="nc-email" type="email" placeholder="hola@negocio.com" /></div>
        <div class="form-group"><label>Contraseña provisional</label><input id="nc-password" type="password" placeholder="••••••••" /></div>
        <div class="error-msg" id="nc-error"></div>
        <div class="modal-footer">
          <button class="btn ghost" id="nc-cancel">Cancelar</button>
          <button class="btn primary" id="nc-confirm">Crear cliente</button>
        </div>
      </div>`;
      document.body.appendChild(div);
      _newClientModal = div;
      $('nc-cancel').onclick = () => div.classList.add('hidden');
      $('nc-confirm').onclick = doCreateClient;
      div.addEventListener('click', e => { if (e.target === div) div.classList.add('hidden'); });
    }
    $('nc-name').value = ''; $('nc-email').value = ''; $('nc-password').value = ''; $('nc-error').textContent = '';
    _newClientModal.classList.remove('hidden');
    $('nc-name').focus();
  }

  async function doCreateClient() {
    const name = $('nc-name').value.trim();
    const email = $('nc-email').value.trim();
    const password = $('nc-password').value;
    $('nc-error').textContent = '';
    if (!name || !email || !password) { $('nc-error').textContent = 'Todos los campos son obligatorios.'; return; }
    const btn = $('nc-confirm');
    btn.disabled = true; btn.textContent = 'Creando…';
    try {
      const data = await api('POST', '/api/v1/admin/clients', { name, email, password });
      if (!data) return;
      _newClientModal.classList.add('hidden');
      toast('Cliente creado', 'ok');
      loadTab('clients');
    } catch (e) { $('nc-error').textContent = e.message; }
    finally { btn.disabled = false; btn.textContent = 'Crear cliente'; }
  }

  async function doDeleteClient(clientId, name) {
    if (!confirm(`¿Eliminar al cliente "${name}"? Se perderán sus automatizaciones.`)) return;
    try {
      await api('DELETE', `/api/v1/admin/clients/${clientId}`);
      toast('Cliente eliminado');
      $(`cr-${clientId}`)?.remove();
    } catch (e) { toast(e.message, 'err'); }
  }

  $('btn-login').onclick = doLogin;
  $('inp-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('btn-logout').onclick = doLogout;
  $('modal-cancel').onclick = () => $('modal-user').classList.add('hidden');
  $('modal-confirm').onclick = doCreateUser;
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => loadTab(t.dataset.tab);
  });

  restoreSession();
})();
</script>
</body>
</html>
